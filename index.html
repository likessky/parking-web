<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- ============================================ -->
  <!-- 🅿️ 우리 주차 위치 — 평촌푸르지오센트럴파크      -->
  <!-- 희수·차미 주차 위치 공유 모바일 웹 앱           -->
  <!-- ============================================ -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🅿️ 차미희수 주차위치</title>
  <meta name="description" content="평촌푸르지오센트럴파크 지하주차장 주차 위치 실시간 공유">
  <!-- 모바일 홈 화면 추가 시 네이티브 앱처럼 보이게 -->
  <meta name="theme-color" content="#006241">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- 폰트: Pretendard (한글) + Noto Sans KR 폴백 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">

  <style>
    /* ========================================== */
    /* 1. 디자인 토큰 — Starbucks 스타일            */
    /* ========================================== */
    :root {
      --green-50:  #E6F2ED;
      --green-100: #C0DFD2;
      --green-300: #57A585;
      --green-500: #00704A;   /* Siren Green */
      --green-600: #006241;
      --green-700: #00543A;
      --green-800: #1E3932;   /* House Green */
      --mint:      #D4E9E2;
      --cream:     #F2F0EB;
      --subtle:    #F7F6F2;
      --gold:      #CBA258;
      --gold-dark: #B5873A;

      --bg-base:     #F2F0EB;
      --bg-elevated: #FFFFFF;
      --text:        #1E3932;
      --text-2:      #5A554C;
      --text-3:      #9B968A;
      --border:        #E4E1D8;
      --border-strong: #CBC7BB;

      --info-bg:    #E3EEF0;
      --info-fg:    #2E6B72;
      --warning-bg: #FBEFD6;
      --warning-fg: #A6791C;
      --error-fg:   #C0392B;

      --color-heesoo: #B5873A;
      --color-chami:  #00704A;

      --font: 'Pretendard Variable', 'Pretendard', 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --radius-full: 9999px;

      --shadow-sm: 0 1px 2px rgba(30,57,50,0.06);
      --shadow-md: 0 4px 14px rgba(30,57,50,0.10);
      --shadow-lg: 0 12px 28px rgba(30,57,50,0.16);

      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --t-fast: 120ms var(--ease-out);
      --t-base: 220ms var(--ease-out);
    }

    /* ========================================== */
    /* 2. 리셋 및 기본                              */
    /* ========================================== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100vh;
      font-family: var(--font);
      background: var(--bg-base);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    button { font-family: var(--font); }
    .hidden { display: none !important; }

    .screen {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.3s ease;
    }
    .screen.hidden { display: none; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* 공통 버튼 (pill) */
    .btn {
      font: 600 15px/1 var(--font);
      border-radius: var(--radius-full);
      padding: 0 22px;
      height: 44px;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast), transform var(--t-fast);
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--green-500); color: #fff; }
    .btn-primary:hover { background: var(--green-600); }
    .btn-secondary { background: transparent; color: var(--green-600); border-color: var(--green-600); }
    .btn-secondary:hover { background: var(--green-50); }
    .btn-ghost { background: transparent; color: var(--text); border-color: var(--border-strong); }
    .btn-ghost:hover { background: var(--subtle); }
    .btn-danger { background: transparent; color: var(--error-fg); border-color: var(--error-fg); }
    .btn-danger:hover { background: #FBE4E1; }
    .btn-sm { height: 36px; padding: 0 16px; font-size: 13px; }

    /* ========================================== */
    /* 3. 메인 화면 — 헤더 / 히어로                   */
    /* ========================================== */
    .app-header {
      display: flex; align-items: center; gap: 12px;
      padding: 14px clamp(20px, 5vw, 40px);
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      position: relative; z-index: 3;
    }
    .brand-badge {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--green-500); color: #fff;
      display: grid; place-items: center;
      font-weight: 800; font-size: 17px;
      box-shadow: 0 1px 3px rgba(30,57,50,.16);
    }
    .app-header h1 { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; color: var(--green-800); }
    .settings-btn {
      margin-left: auto;
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      font-size: 17px; cursor: pointer;
      display: grid; place-items: center;
      transition: background var(--t-fast);
    }
    .settings-btn:hover { background: var(--subtle); }

    .hero-banner {
      position: relative; overflow: hidden;
      background: var(--green-600); color: #fff;
      padding: 40px clamp(20px, 6vw, 56px);
    }
    .hero-banner::before, .hero-banner::after {
      content: ''; position: absolute; border: 1px solid rgba(255,255,255,.16); border-radius: 50%;
    }
    .hero-banner::before { width: 320px; height: 320px; right: -80px; top: -140px; }
    .hero-banner::after  { width: 200px; height: 200px; left: -100px; bottom: -120px; }
    .hero-inner { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; }
    .hero-banner .eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      margin-bottom: 12px; font-size: 11px; font-weight: 700; letter-spacing: .14em;
    }
    .hero-banner .eyebrow::before { content: ''; width: 28px; height: 2px; background: var(--gold); }
    .hero-banner h2 { font-size: clamp(24px, 4vw, 34px); font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px; }
    .hero-banner p { font-size: 15px; color: var(--mint); }

    /* ========================================== */
    /* 4. 메인 화면 — 사용자 카드                     */
    /* ========================================== */
    .users-container {
      display: grid; grid-template-columns: 1fr; gap: 20px;
      padding: 28px clamp(20px, 5vw, 40px) 40px;
      width: 100%; max-width: 1200px; margin: 0 auto;
    }
    @media (min-width: 900px) { .users-container { grid-template-columns: 1fr 1fr; } }

    .user-card {
      position: relative; overflow: hidden;
      min-height: 220px;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 20px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: box-shadow var(--t-base), transform var(--t-base);
    }
    .user-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .user-card.heesoo { --user-color: var(--color-heesoo); }
    .user-card.chami  { --user-color: var(--color-chami); }

    .minimap-wrap {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      opacity: 0.32; z-index: 1;
    }
    .user-info-wrap {
      position: relative; z-index: 5;
      display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
      text-align: right; pointer-events: none;
    }
    .user-name {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 5px 14px 5px 10px;
      border-radius: var(--radius-full);
      background: var(--user-color); color: #fff;
      font-size: 16px; font-weight: 800;
    }
    .car-icon-display { font-size: 22px; line-height: 1; }
    .parking-info {
      display: flex; align-items: center; justify-content: flex-end;
      min-height: 44px; padding: 8px 16px;
      background: rgba(255,255,255,0.92);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      font-size: 22px; font-weight: 800; letter-spacing: -0.4px;
      color: var(--user-color); word-break: keep-all;
    }
    .not-registered { font-size: 18px; color: var(--text-3); font-weight: 700; }
    .parking-time {
      font-size: 13px; font-weight: 600; color: var(--text-2);
      background: rgba(255,255,255,0.92);
      padding: 2px 10px; border-radius: var(--radius-full);
    }
    .parking-time:empty { display: none; }

    /* ========================================== */
    /* 5. 상세 화면 — 헤더 / 레이아웃                 */
    /* ========================================== */
    .detail-header {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
      padding: 14px clamp(16px, 4vw, 32px);
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      position: relative; z-index: 10;
    }
    .detail-header h2 { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; text-align: center; }
    .detail-header .back-btn { justify-self: start; }
    .detail-header .edit-btn { justify-self: end; }
    #detail-screen.editing .edit-btn { visibility: hidden; }

    .detail-content {
      display: flex; flex-direction: column; flex: 1;
      padding: 20px; gap: 20px;
      max-width: 1400px; margin: 0 auto; width: 100%;
    }
    .left-panel {
      display: flex; flex-direction: column; flex: 1; min-width: 0;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .right-panel { display: flex; flex-direction: column; gap: 16px; flex-shrink: 0; }
    @media (min-width: 1024px) {
      .detail-content { flex-direction: row; align-items: flex-start; }
      .left-panel { flex: 8; min-height: 60vh; }
      .right-panel { flex: 2.5; min-width: 300px; max-width: 360px; position: sticky; top: 20px; }
    }

    /* 자주 쓰는 칸 */
    .freq-section {
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-elevated);
    }
    .freq-title { font-size: 11px; font-weight: 800; letter-spacing: .12em; color: var(--green-600); margin-bottom: 8px; }
    .freq-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .freq-chip {
      display: inline-flex; align-items: center; gap: 6px;
      height: 36px; padding: 0 14px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-full);
      background: var(--bg-elevated); color: var(--text);
      font-size: 13px; font-weight: 700; cursor: pointer;
      transition: background var(--t-fast), border-color var(--t-fast);
    }
    .freq-chip:hover { background: var(--green-50); border-color: var(--green-500); }
    .freq-chip.active { background: var(--green-500); border-color: var(--green-500); color: #fff; }
    .freq-chip .badge {
      font-size: 10px; font-weight: 800; padding: 1px 7px; border-radius: var(--radius-full);
      background: var(--gold); color: #fff;
    }
    .freq-chip .cnt { color: var(--text-2); font-weight: 600; }
    .freq-chip.active .cnt { color: var(--mint); }
    .freq-empty { font-size: 13px; color: var(--text-3); }

    /* 층 탭 */
    .floor-tabs {
      display: flex; gap: 8px; padding: 12px 16px;
      background: var(--subtle);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .floor-tab {
      flex: 1 0 auto; min-width: 56px; height: 38px; padding: 0 14px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-full);
      background: var(--bg-elevated); color: var(--text-2);
      font-size: 14px; font-weight: 700; cursor: pointer;
      transition: background var(--t-fast), color var(--t-fast);
    }
    .floor-tab:hover { background: var(--green-50); }
    .floor-tab.active { background: var(--green-500); border-color: var(--green-500); color: #fff; }
    .floor-tab.custom::after { content: ' ✎'; font-size: 11px; opacity: .8; }

    /* 편집 바 */
    .edit-bar {
      display: none;
      flex-wrap: wrap; align-items: center; gap: 10px;
      padding: 12px 16px;
      background: var(--warning-bg); color: var(--warning-fg);
      border-bottom: 1px solid #EBD9AE;
    }
    #detail-screen.editing .edit-bar { display: flex; }
    .edit-bar .edit-msg { flex: 1 1 220px; font-size: 13px; font-weight: 700; line-height: 1.4; }
    .edit-bar .edit-msg strong { color: var(--green-800); }
    .edit-bar .edit-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    #detail-screen.editing .freq-section,
    #detail-screen.editing .right-panel { display: none; }

    /* ========================================== */
    /* 6. 주차장 배치도 (격자)                        */
    /* ========================================== */
    .map-container {
      flex: 1; padding: 12px; overflow: auto;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-elevated);
    }
    .map-zoom-wrapper {
      display: flex; align-items: center; justify-content: center;
      width: 100%;
    }
    .parking-grid {
      --sel-color: var(--green-500);
      position: relative;
      width: 100%; max-width: 1000px;
      padding: 30px;
      margin: 0 auto;
    }
    .grid-cells {
      display: grid; gap: 4px;
      width: 100%;
      aspect-ratio: var(--cols) / var(--rows);
    }

    .slot {
      position: relative; min-width: 0; min-height: 0;
      background: #fff;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      cursor: pointer;
      transition: background var(--t-fast), border-color var(--t-fast), box-shadow var(--t-fast);
    }
    .slot-inner {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .slot:hover { background: var(--green-50); border-color: var(--green-300); }
    .slot-compact { background: var(--mint); border-color: #A9CBBE; }
    .slot-ev      { background: var(--info-bg); border-color: #B5D0D5; }
    .slot-compact:hover, .slot-ev:hover { filter: brightness(0.97); }

    .slot-text { font-size: 14px; font-weight: 800; color: rgba(30,57,50,0.38); }
    .zone-label {
      position: absolute; top: 2px; left: 4px;
      font-size: 10px; font-weight: 800; letter-spacing: -0.3px;
      color: var(--text-2); white-space: nowrap;
    }
    .type-badge {
      position: absolute; bottom: 2px; right: 4px;
      font-size: 10px; font-weight: 800; color: var(--green-700);
    }
    .slot-ev .type-badge { color: var(--info-fg); }
    .fav-star { position: absolute; top: 2px; right: 4px; font-size: 11px; color: var(--gold); }

    .slot.selected { box-shadow: 0 0 0 3px var(--sel-color); background: #fff; z-index: 4; }
    .slot.parked { z-index: 3; }
    .slot.parked .slot-text { display: none; }
    .slot.parked-heesoo { background: var(--color-heesoo); border-color: var(--color-heesoo); }
    .slot.parked-chami  { background: var(--color-chami);  border-color: var(--color-chami); }
    .slot.parked .zone-label, .slot.parked .type-badge, .slot.parked .fav-star { color: rgba(255,255,255,0.85); }

    .car-marker {
      display: flex; flex-direction: column; align-items: center; gap: 1px;
      font-size: 24px; line-height: 1;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.25));
    }
    .car-name { font-size: 10px; font-weight: 800; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }

    /* 편집 모드 */
    #detail-screen.editing .slot:not(.slot-empty) { box-shadow: 0 0 0 1px rgba(0,112,74,0.3); }
    .slot-empty {
      background: transparent;
      border: 1.5px dashed var(--border-strong);
    }
    .slot-empty .slot-inner { color: var(--text-3); font-size: 18px; font-weight: 700; }
    .slot-empty:hover { background: var(--green-50); border-color: var(--green-500); }

    /* 통로 / 출입구 */
    .area {
      display: flex; align-items: center; justify-content: center;
      border-radius: 10px; pointer-events: none; text-align: center;
    }
    .area-road { background: var(--subtle); border: 1px dashed var(--border-strong); }
    .area-entrance { background: var(--warning-bg); border: 1px dashed #E3CB93; }
    .area-label { font-size: 12px; font-weight: 800; color: var(--text-2); line-height: 1.25; }
    .area-entrance .area-label { font-size: 15px; color: var(--warning-fg); }

    /* 방위 */
    .grid-dir { position: absolute; font-size: 16px; font-weight: 800; color: var(--text-3); pointer-events: none; z-index: 5; }
    .grid-dir.dir-top    { top: 14px;    left: 50%;  transform: translate(-50%, -50%); }
    .grid-dir.dir-bottom { bottom: 14px; left: 50%;  transform: translate(-50%, 50%); }
    .grid-dir.dir-left   { left: 14px;   top: 50%;   transform: translate(-50%, -50%); }
    .grid-dir.dir-right  { right: 14px;  top: 50%;   transform: translate(50%, -50%); }

    /* 미니맵 */
    .parking-grid.mini { max-width: none; height: 100%; padding: 8px; margin: 0; }
    .parking-grid.mini .grid-cells { height: 100%; aspect-ratio: auto; gap: 2px; }
    .parking-grid.mini .slot { border-radius: 3px; cursor: default; }
    .parking-grid.mini .slot:hover { background: #fff; border-color: var(--border-strong); }
    .parking-grid.mini .slot-compact:hover { background: var(--mint); }
    .parking-grid.mini .slot-ev:hover { background: var(--info-bg); }
    .parking-grid.mini .car-marker { font-size: 16px; }
    .parking-grid.mini .car-name { display: none; }
    .parking-grid.mini .area-label { font-size: 8px; }
    .parking-grid.mini .area { border-radius: 4px; }
    .mini-pin {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      font-size: 34px; z-index: 100;
      text-shadow: 0 3px 6px rgba(0,0,0,0.5);
    }

    /* ========================================== */
    /* 7. 우측 조작 패널                             */
    /* ========================================== */
    .register-section {
      display: flex; flex-direction: column; gap: 12px;
      background: var(--bg-elevated);
      padding: 16px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    .selection-info {
      font-size: 14px; color: var(--text-2);
      background: var(--subtle);
      padding: 12px; border-radius: var(--radius-md);
      text-align: center; border: 1px solid var(--border);
    }
    .selection-info strong { display: block; margin-top: 4px; font-size: 17px; font-weight: 800; color: var(--green-800); letter-spacing: -0.3px; }
    .selection-info .swap-note { display: block; margin-top: 6px; font-size: 12px; font-weight: 700; color: var(--warning-fg); }

    .register-btn {
      width: 100%; height: 52px; border: none;
      border-radius: var(--radius-full);
      font-size: 17px; font-weight: 800; cursor: pointer;
      background: var(--border-strong); color: #fff;
      transition: background var(--t-fast), transform var(--t-fast);
    }
    .register-btn.active.heesoo { background: var(--color-heesoo); }
    .register-btn.active.chami  { background: var(--color-chami); }
    .register-btn.active:hover  { filter: brightness(0.94); }
    .register-btn.active:active { transform: scale(0.98); }
    .register-btn:disabled { cursor: not-allowed; }

    .legend-section {
      background: var(--bg-elevated);
      padding: 14px 16px; border-radius: var(--radius-lg);
      border: 1px solid var(--border); box-shadow: var(--shadow-sm);
    }
    .legend-section h3 { font-size: 11px; font-weight: 800; letter-spacing: .12em; color: var(--green-600); margin-bottom: 10px; }
    .legend-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; font-size: 13px; color: var(--text-2); font-weight: 600; }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .swatch { width: 18px; height: 18px; border-radius: 5px; border: 1px solid var(--border-strong); background: #fff; flex-shrink: 0; }
    .swatch.compact { background: var(--mint); border-color: #A9CBBE; }
    .swatch.ev { background: var(--info-bg); border-color: #B5D0D5; }
    .swatch.heesoo { background: var(--color-heesoo); border-color: var(--color-heesoo); }
    .swatch.chami { background: var(--color-chami); border-color: var(--color-chami); }
    .legend-hint { margin-top: 10px; font-size: 12px; color: var(--text-3); line-height: 1.45; }

    /* ========================================== */
    /* 8. 모달 / 시트                               */
    /* ========================================== */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(30,57,50,0.55); backdrop-filter: blur(3px);
      z-index: 100; display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    .modal-overlay.hidden { display: none; }
    .modal-content {
      background: var(--bg-elevated); border-radius: var(--radius-xl);
      padding: 28px 24px 24px;
      width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto;
      box-shadow: var(--shadow-lg);
    }
    .modal-content h3 { font-size: 19px; font-weight: 800; text-align: center; margin-bottom: 18px; letter-spacing: -0.3px; }
    .modal-content .modal-msg { font-size: 15px; line-height: 1.55; color: var(--text-2); text-align: center; margin-bottom: 20px; word-break: keep-all; }
    .modal-actions { display: flex; gap: 8px; }

    .modal-user-section { margin-bottom: 22px; }
    .modal-user-section h4 { font-size: 15px; font-weight: 800; margin-bottom: 10px; }

    .modal-user-section h4.chami-title  { color: var(--color-chami); }
    .icon-options { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .icon-option {
      width: 54px; height: 54px; border: 2px solid var(--border); border-radius: 50%;
      background: var(--subtle); font-size: 27px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color var(--t-fast), background var(--t-fast);
    }
    .icon-option.selected { border-color: var(--green-500); background: var(--green-50); }

    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; font-weight: 800; color: var(--text-2); margin-bottom: 6px; letter-spacing: .04em; }
    .input {
      width: 100%; padding: 12px 16px;
      background: var(--bg-elevated);
      border: 1px solid var(--border); border-radius: var(--radius-md);
      font: 400 15px/1.4 var(--font); color: var(--text);
    }
    .input:focus { outline: none; border-color: var(--green-500); box-shadow: 0 0 0 3px rgba(0,112,74,0.14); }
    .pill-group { display: flex; gap: 8px; }
    .pill-group button {
      flex: 1; height: 40px; border-radius: var(--radius-full);
      border: 1px solid var(--border-strong); background: var(--bg-elevated);
      color: var(--text-2); font-size: 14px; font-weight: 700; cursor: pointer;
      transition: background var(--t-fast), color var(--t-fast);
    }
    .pill-group button.active { background: var(--green-500); border-color: var(--green-500); color: #fff; }
    .sheet-actions { display: flex; gap: 8px; margin-top: 18px; }
    .sheet-actions .btn { flex: 1; padding: 0 12px; }

    #toast {
      position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(120px);
      padding: 13px 22px; background: var(--green-800); color: #fff;
      font-size: 14px; font-weight: 700; border-radius: var(--radius-full);
      box-shadow: var(--shadow-lg); z-index: 200;
      transition: transform 0.4s var(--ease-out);
      white-space: nowrap; max-width: 92%; text-align: center; overflow: hidden; text-overflow: ellipsis;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* ========================================== */
    /* 9. 모바일 (767px 이하)                        */
    /* ========================================== */
    @media (max-width: 767px) {
      .app-header h1 { font-size: 16px; }

      .map-container {
        position: relative; overflow: hidden; padding: 0;
        min-height: 62vh; touch-action: none;

      }
      .map-zoom-wrapper {

      .map-zoom-wrapper .grid-dir.dir-bottom { transform: translate(-50%, 50%) rotate(90deg); }

      .map-zoom-wrapper .slot-text { font-size: 20px; }

      .map-zoom-wrapper .type-badge { font-size: 12px; }

      /* 하단 고정 등록 바 */

  <!-- ========================================== -->
  <!-- JavaScript — Firebase + 앱 로직              -->
  <!-- ========================================== -->
  <script type="module">
    // ============================================
    // 1. Firebase
    // ============================================
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, get, update, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey:            "AIzaSyAN1EWDoLKC5z0Bt2doFl0qP0IrDmNRpMo",
      authDomain:        "parking-web-5ab20.firebaseapp.com",
      databaseURL:       "https://parking-web-5ab20-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId:         "parking-web-5ab20",
      storageBucket:     "parking-web-5ab20.firebasestorage.app",
      messagingSenderId: "430170192056",
      appId:             "1:430170192056:web:dc238cb79eee2c05955c4d",
      measurementId:     "G-VJH0FS4123"
    };

    let db;
    try {
      const app = initializeApp(firebaseConfig);
      db = getDatabase(app);
    } catch (err) {
      console.error('Firebase 초기화 실패:', err);
      showToast('⚠️ Firebase 설정을 확인해 주세요!');
    }

    // ============================================
    // 2. 상수
    // ============================================
    const USERS = ['희수', '차미'];
    const USER_KEY = { '희수': 'heesoo', '차미': 'chami' };
    const FLOORS = ['B2', 'B3', 'B4', 'B5', 'B6'];
    const HISTORY_MAX = 30;       // 자주 쓰는 칸 계산용 이력 보관 개수
    const FREQ_MAX = 4;           // 자주 쓰는 칸 표시 개수
    const TYPE_LABEL = { normal: '일반', compact: '경차', ev: '전기차' };

    const CAR_ICONS = [
      { id: 'sedan',   emoji: '🚗',  name: '세단' },
      { id: 'suv',     emoji: '🚙',  name: 'SUV' },
      { id: 'compact', emoji: '🚘',  name: '소형차' },
      { id: 'truck',   emoji: '🛻',  name: '트럭' },
      { id: 'sport',   emoji: '🏎️', name: '스포츠카' },
    ];
    function getCarEmoji(iconId) {
      return CAR_ICONS.find(i => i.id === iconId)?.emoji || '🚗';
    }

    // ============================================
    // 3. 기본 배치 (격자: 칸 하나 = 격자 한 칸)
    //    x = 열(0부터), y = 행(0부터)
    //    칸 id = "구역명-번호" (기본 칸) / "c..." (새로 추가한 칸)
    // ============================================
    function buildDefaultLayout() {
      const cells = {};
      const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
      const col = (x, y0, y1) => range(y0, y1).map(y => [x, y]);
      const row = (y, x0, x1) => range(x0, x1).map(x => [x, y]);
      const add = (zone, type, pts) => pts.forEach(([x, y], i) => {
        const no = i + 1, id = `${zone}-${no}`;
        cells[id] = { id, x, y, type, zone, no };
      });

      add('남측',       'normal',  col(0, 0, 9));
      add('서남측',     'normal',  row(2, 2, 5));
      add('서북측',     'normal',  row(2, 7, 10));
      add('북측모서리', 'normal',  row(2, 11, 12));
      add('중앙경차1',  'compact', [[6, 5]]);
      add('중앙경차2',  'compact', [[6, 6]]);
      add('중앙경차3',  'compact', [[7, 6]]);
      add('중앙일반',   'normal',  row(5, 7, 9));
      add('중앙북측',   'normal',  col(10, 5, 7));
      add('북서측',     'normal',  col(13, 0, 1));
      add('전기차1',    'ev',      [[13, 2]]);
      add('전기차2',    'ev',      [[13, 3]]);
      add('북동측',     'normal',  col(13, 4, 9));
      add('동측',       'normal',  row(10, 1, 12));

      return {
        cols: 14, rows: 11, cells,
        areas: [
          { x: 2, y: 1, w: 4, h: 1, kind: 'road',     label: '내려가는<br>길' },
          { x: 7, y: 1, w: 4, h: 1, kind: 'road',     label: '올라가는<br>길' },
          { x: 1, y: 5, w: 5, h: 2, kind: 'entrance', label: '103동<br>출입구' },
        ]
      };
    }

    // ============================================
    // 4. 앱 상태
    //    - localStorage 미사용! 모든 데이터는 Firebase에만 저장
    // ============================================
    let usersData = { '희수': null, '차미': null };
    let layoutsData = {};             // Firebase layouts/{floor}
    let currentUser = null;
    let selectedFloor = 'B2';
    let selectedSlotId = null;
    let pinchAbortCtrl = null;
    const mapView = { scale: null, posX: 0, posY: 0 };   // 모바일 줌 상태 (재렌더 후에도 유지)

    // 배치 편집 상태
    let editMode = false;
    let draftLayout = null;
    let draftFloor = null;
    let draftDirty = false;
    let sheetCtx = null;

    // ============================================
    // 5. 레이아웃 / 기록 헬퍼
    // ============================================
    function toArray(v) {
      if (Array.isArray(v)) return v.filter(Boolean);
      return v && typeof v === 'object' ? Object.values(v) : [];
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function normalizeLayout(raw) {
      const out = { cols: Number(raw?.cols) || 14, rows: Number(raw?.rows) || 11, cells: {}, areas: toArray(raw?.areas) };
      const cells = raw?.cells || {};
      Object.keys(cells).forEach(id => {
        const c = cells[id];
        if (c && Number.isFinite(c.x) && Number.isFinite(c.y)) {
          out.cells[id] = { id, x: c.x, y: c.y, type: c.type || 'normal', zone: String(c.zone ?? ''), no: Number(c.no) || 0 };
        }
      });
      return out;
    }

    function getLayout(floor) {
      return layoutsData[floor] ? normalizeLayout(layoutsData[floor]) : buildDefaultLayout();
    }

    function activeLayout(floor) {
      return (editMode && draftLayout && floor === draftFloor) ? draftLayout : getLayout(floor);
    }

    function findCell(floor, slotId) {
      return slotId ? getLayout(floor).cells[slotId] : null;
    }

    // 예전 영어/한글 ID -> 현재 표시 이름
    function getZoneName(id) {
      const map = {
        'L1': '남측', 'ROAD_DOWN': '내려가는길', 'ROAD_UP': '올라가는길',
        'B08': '서남측', 'B09': '서북측', 'TR1': '북측모서리',
        'ENTRANCE': '출입구', 'CP1': '중앙경차1', 'C1': '중앙일반',
        'CP2': '중앙경차2', 'CP3': '중앙경차3', 'B14': '중앙북측',
        'R1': '북서측', 'EV1': '전기차1', 'EV2': '전기차2',
        'B12': '북동측', 'BTM': '동측',
        '서측': '남측', '북서측': '서남측', '북동측': '서북측', '우측모서리': '북측모서리',
        '중앙동측': '중앙북측', '동측상단': '북서측', '동측하단': '북동측', '남측': '동측'
      };
      return map[id] || id;
    }

    // 주차 기록 -> 칸 id (예전 기록은 zone+slot 으로 변환)
    function recSlotId(rec) {
      if (!rec) return null;
      if (rec.slotId) return rec.slotId;
      if (rec.zone != null && rec.slot != null) return `${getZoneName(rec.zone)}-${rec.slot}`;
      return null;
    }
    function isAt(rec, floor, slotId) {
      return !!rec && !!rec.floor && rec.floor === floor && recSlotId(rec) === slotId;
    }
    function otherUser(user) { return user === '희수' ? '차미' : '희수'; }

    // 기록의 표시용 {floor, zone, no} (배치에 칸이 있으면 배치의 이름 우선)
    function spotOf(rec) {
      const id = recSlotId(rec);
      const cell = id ? findCell(rec.floor, id) : null;
      if (cell) return { floor: rec.floor, zone: cell.zone, no: cell.no };
      if (rec.slotId) return { floor: rec.floor, zone: rec.zone, no: rec.no };
      return { floor: rec.floor, zone: getZoneName(rec.zone), no: rec.slot };
    }

    // ============================================
    // 6. 선택 제한
    // ============================================
    function canSelect(cell, user) {
      if (cell.type === 'ev') {
        showToast('⚡ 전기차 전용 칸입니다');
        return false;
      }
      if (cell.type === 'compact' && user === '희수') {
        showToast('🚙 경차 전용 칸입니다. 희수 차는 주차할 수 없어요');
        return false;
      }
      return true;
    }

    // ============================================
    // 7. Firebase 실시간 리스너
    // ============================================
    function setupListeners() {
      if (!db) return;

      USERS.forEach(name => {
        onValue(ref(db, `users/${name}`), (snapshot) => {
          usersData[name] = snapshot.val();
          updateMainCard(name);
          if (currentUser) refreshDetail();
        });
      });

      onValue(ref(db, 'layouts'), (snapshot) => {
        layoutsData = snapshot.val() || {};
        USERS.forEach(updateMainCard);
        if (currentUser) {
          renderFloorTabs();
          refreshDetail();
        }
      });
    }

    function refreshDetail() {
      // 선택한 칸이 배치에서 사라졌으면 선택 해제
      if (selectedSlotId && !activeLayout(selectedFloor).cells[selectedSlotId]) selectedSlotId = null;
      renderDetailMap();
      renderFrequent();
      updateSelectionInfo();
    }

    // ============================================
    // 8. 메인 화면 카드
    // ============================================
    function updateMainCard(userName) {
      const data = usersData[userName];
      const key = USER_KEY[userName];
      const infoEl = document.getElementById(`info-${key}`);
      const timeEl = document.getElementById(`time-${key}`);
      const iconEl = document.getElementById(`icon-${key}`);
      const minimapEl = document.getElementById(`minimap-${key}`);

      iconEl.textContent = getCarEmoji(data?.carIcon);
      if (data && data.floor) {
        const s = spotOf(data);
        infoEl.innerHTML = `<strong>${esc(s.floor)} › ${esc(s.zone)} › ${esc(s.no)}번 칸</strong>`;
        timeEl.textContent = formatDateTime(data.registeredAt);
        renderMiniMap(minimapEl, data.floor, userName);
      } else {
        infoEl.innerHTML = '<span class="not-registered">미등록</span>';
        timeEl.textContent = '';
        renderMiniMap(minimapEl, 'B2', userName);
      }
    }

    // ============================================
    // 9. 주차장 격자 렌더링
    //    interactive: 칸 클릭 가능 / mini: 축소판
    // ============================================
    function createParkingGrid(floor, interactive, mini, targetUser) {
      const layout = activeLayout(floor);
      const grid = document.createElement('div');
      grid.className = 'parking-grid' + (mini ? ' mini' : '');
      grid.style.setProperty('--cols', layout.cols);
      grid.style.setProperty('--rows', layout.rows);
      if (interactive && currentUser) {
        grid.style.setProperty('--sel-color', currentUser === '희수' ? 'var(--color-heesoo)' : 'var(--color-chami)');
      }

      const cellsEl = document.createElement('div');
      cellsEl.className = 'grid-cells';
      cellsEl.style.gridTemplateColumns = `repeat(${layout.cols}, 1fr)`;
      cellsEl.style.gridTemplateRows = `repeat(${layout.rows}, 1fr)`;

      // 통로 / 출입구 영역
      const covered = new Set();
      layout.areas.forEach(a => {
        for (let dx = 0; dx < a.w; dx++) for (let dy = 0; dy < a.h; dy++) covered.add(`${a.x + dx},${a.y + dy}`);
        const el = document.createElement('div');
        el.className = `area area-${a.kind}`;
        el.style.gridColumn = `${a.x + 1} / span ${a.w}`;
        el.style.gridRow = `${a.y + 1} / span ${a.h}`;
        el.innerHTML = `<span class="area-label">${a.label || ''}</span>`;
        cellsEl.appendChild(el);
      });

      // 좌표 -> 칸, 구역별 첫 칸(라벨 표시용)
      const byPos = {};
      const firstOfZone = {};
      Object.values(layout.cells).forEach(c => {
        byPos[`${c.x},${c.y}`] = c;
        const f = firstOfZone[c.zone];
        if (!f || c.y < f.y || (c.y === f.y && c.x < f.x)) firstOfZone[c.zone] = c;
      });

      const favSet = (interactive && !mini && currentUser && !editMode) ? favoriteKeySet(currentUser) : new Set();

      for (let y = 0; y < layout.rows; y++) {
        for (let x = 0; x < layout.cols; x++) {
          const key = `${x},${y}`;
          if (covered.has(key)) continue;
          const cell = byPos[key];

          if (!cell) {
            if (editMode && interactive) {
              const empty = document.createElement('div');
              empty.className = 'slot slot-empty';
              empty.style.gridColumn = x + 1;
              empty.style.gridRow = y + 1;
              empty.innerHTML = '<div class="slot-inner">＋</div>';
              empty.addEventListener('click', () => openCellSheet(null, x, y));
              cellsEl.appendChild(empty);
            }
            continue;
          }

          const slotEl = document.createElement('div');
          slotEl.className = `slot slot-${cell.type}`;
          slotEl.style.gridColumn = x + 1;
          slotEl.style.gridRow = y + 1;
          slotEl.dataset.slot = cell.id;

          let inner = '';
          if (!mini) {
            if (firstOfZone[cell.zone] === cell) inner += `<span class="zone-label">${esc(cell.zone)}</span>`;
            inner += `<span class="slot-text">${esc(cell.no)}</span>`;
            if (cell.type === 'compact') inner += '<span class="type-badge">경차</span>';
            if (cell.type === 'ev') inner += '<span class="type-badge">⚡</span>';
            if (favSet.has(`${floor}|${cell.id}`)) inner += '<span class="fav-star">★</span>';
          }

          // 주차된 차량 마커
          let parkedBy = null;
          USERS.forEach(u => { if (isAt(usersData[u], floor, cell.id)) parkedBy = u; });
          if (parkedBy) {
            slotEl.classList.add('parked', `parked-${USER_KEY[parkedBy]}`);
            inner += `<span class="car-marker">${getCarEmoji(usersData[parkedBy].carIcon)}<span class="car-name">${parkedBy}</span></span>`;
          }

          // 미니맵 위치 핀
          if (mini && targetUser && isAt(usersData[targetUser], floor, cell.id)) {
            slotEl.style.background = 'rgba(255, 71, 87, 0.9)';
            inner += '<span class="mini-pin">📍</span>';
          }

          slotEl.innerHTML = `<div class="slot-inner">${inner}</div>`;

          if (interactive && !editMode && selectedSlotId === cell.id && selectedFloor === floor) {
            slotEl.classList.add('selected');
          }

          if (interactive) {
            slotEl.addEventListener('click', () => {
              if (editMode) openCellSheet(cell);
              else handleSlotClick(cell);
            });
          }
          cellsEl.appendChild(slotEl);
        }
      }

      grid.appendChild(cellsEl);

      // 방위 표시 (도면 가장자리). 모바일에서는 도면이 회전되므로 CSS에서 글자만 역회전
      if (!mini) {
        [['dir-top', '서'], ['dir-right', '북'], ['dir-bottom', '동'], ['dir-left', '남']].forEach(([cls, txt]) => {
          const d = document.createElement('div');
          d.className = `grid-dir ${cls}`;
          d.textContent = txt;
          grid.appendChild(d);
        });
      }
      return grid;
    }

    function renderMiniMap(container, floor, userName) {
      container.innerHTML = '';
      container.appendChild(createParkingGrid(floor, false, true, userName));
    }

    function renderDetailMap() {
      const container = document.getElementById('detail-map');
      container.innerHTML = '';
      if (pinchAbortCtrl) { pinchAbortCtrl.abort(); pinchAbortCtrl = null; }

      const wrapper = document.createElement('div');
      wrapper.className = 'map-zoom-wrapper';
      wrapper.id = 'map-zoom-wrapper';
      wrapper.appendChild(createParkingGrid(selectedFloor, true, false));
      container.appendChild(wrapper);

      initPinchZoom(container, wrapper);
    }

    // ============================================
    // 10. 칸 선택 / 등록
    // ============================================
    function handleSlotClick(cell) {
      if (!canSelect(cell, currentUser)) return;
      selectedSlotId = (selectedSlotId === cell.id) ? null : cell.id;
      renderDetailMap();
      renderFrequent();
      updateSelectionInfo();
    }

    function updateSelectionInfo() {
      const infoEl = document.getElementById('selection-info');
      const btnEl  = document.getElementById('register-btn');
      const cell = findCell(selectedFloor, selectedSlotId);

      if (cell) {
        const other = otherUser(currentUser);
        const swap = isAt(usersData[other], selectedFloor, cell.id);
        infoEl.innerHTML = `선택: <strong>${esc(selectedFloor)} › ${esc(cell.zone)} › ${esc(cell.no)}번 칸</strong>` +
          (swap ? `<span class="swap-note">${other} 차가 있던 칸 — 등록하면 ${currentUser} 차로 바뀝니다</span>` : '');
        btnEl.disabled = false;
        btnEl.className = `register-btn active ${USER_KEY[currentUser]}`;
        btnEl.textContent = swap ? '바꿔서 등록' : '등록하기';
      } else {
        infoEl.textContent = '칸을 선택해 주세요';
        btnEl.disabled = true;
        btnEl.className = 'register-btn';
        btnEl.textContent = '등록하기';
      }
    }

    async function handleRegister() {
      if (!currentUser || editMode) return;
      const cell = findCell(selectedFloor, selectedSlotId);
      if (!cell) return;

      const other = otherUser(currentUser);
      const takeover = isAt(usersData[other], selectedFloor, cell.id);
      if (takeover) {
        const ok = await confirmDialog(
          '주차 차량 변경',
          `${selectedFloor} › ${cell.zone} › ${cell.no}번 칸에는 ${other} 차가 등록되어 있어요.\n${currentUser} 차로 바꿀까요? (${other}은 미등록 상태가 됩니다)`,
          '바꾸기'
        );
        if (!ok) return;
      }

      if (await saveParking(currentUser, selectedFloor, cell, takeover)) {
        showToast(takeover ? `✅ ${currentUser} 차로 바뀌었습니다` : `✅ ${currentUser}의 주차 위치가 등록되었습니다!`);
        goToMain();
      }
    }

    // 주차 위치 저장 (takeover: 같은 칸의 상대 차 기록을 지움)
    async function saveParking(user, floor, cell, takeover) {
      if (!db) { showToast('⚠️ Firebase가 연결되지 않았습니다'); return false; }
      try {
        const now = new Date().toISOString();
        const snapshot = await get(ref(db, `users/${user}`));
        const cur = snapshot.val() || {};

        const history = toArray(cur.history);
        history.unshift({ floor, slotId: cell.id, zone: cell.zone, no: cell.no, registeredAt: now });
        if (history.length > HISTORY_MAX) history.length = HISTORY_MAX;

        const updates = {};
        updates[`users/${user}`] = {
          floor, slotId: cell.id, zone: cell.zone, no: cell.no,
          registeredAt: now,
          carIcon: cur.carIcon || 'sedan',
          history
        };
        if (takeover) {
          const o = otherUser(user);
          ['floor', 'slotId', 'zone', 'slot', 'no', 'registeredAt'].forEach(k => { updates[`users/${o}/${k}`] = null; });
        }
        await update(ref(db), updates);
        return true;
      } catch (err) {
        console.error('등록 실패:', err);
        showToast('❌ 등록에 실패했습니다. 다시 시도해 주세요');
        return false;
      }
    }

    // ============================================
    // 11. 자주 쓰는 칸
    // ============================================
    function favoriteList(user) {
      const d = usersData[user];
      if (!d) return [];
      const hist = toArray(d.history);
      const map = new Map();
      hist.forEach((h, i) => {
        const id = recSlotId(h);
        if (!h.floor || !id) return;
        const k = `${h.floor}|${id}`;
        const e = map.get(k) || { floor: h.floor, slotId: id, count: 0, firstIdx: i };
        e.count++;
        map.set(k, e);
      });
      const latestKey = hist[0] && recSlotId(hist[0]) ? `${hist[0].floor}|${recSlotId(hist[0])}` : null;
      return [...map.entries()]
        .map(([k, e]) => ({ ...e, key: k, latest: k === latestKey, cell: findCell(e.floor, e.slotId) }))
        .filter(e => e.cell)                                   // 삭제된 칸 제외
        .sort((a, b) => b.count - a.count || a.firstIdx - b.firstIdx)
        .slice(0, FREQ_MAX);
    }
    function favoriteKeySet(user) {
      return new Set(favoriteList(user).filter(e => e.count > 1).map(e => e.key));
    }

    function renderFrequent() {
      const box = document.getElementById('freq-list');
      box.innerHTML = '';
      const list = currentUser ? favoriteList(currentUser) : [];
      if (list.length === 0) {
        box.innerHTML = '<span class="freq-empty">등록하면 자주 쓰는 칸이 여기에 쌓여요</span>';
        return;
      }
      list.forEach(e => {
        const btn = document.createElement('button');
        btn.className = 'freq-chip' + (e.floor === selectedFloor && e.slotId === selectedSlotId ? ' active' : '');
        btn.innerHTML = `${esc(e.floor)} · ${esc(e.cell.zone)} ${esc(e.cell.no)}` +
          (e.count > 1 ? ` <span class="cnt">${e.count}회</span>` : '') +
          (e.latest ? ' <span class="badge">최근</span>' : '');
        btn.addEventListener('click', () => {
          if (editMode) return;
          if (!canSelect(e.cell, currentUser)) return;
          selectedFloor = e.floor;
          selectedSlotId = e.slotId;
          renderFloorTabs();
          renderDetailMap();
          renderFrequent();
          updateSelectionInfo();
        });
        box.appendChild(btn);
      });
    }

    // ============================================
    // 12. 화면 전환
    // ============================================
    function goToDetail(userName) {
      currentUser    = userName;
      selectedFloor  = usersData[userName]?.floor || 'B2';
      selectedSlotId = null;
      mapView.scale = null; mapView.posX = 0; mapView.posY = 0;
      editMode = false; draftLayout = null;

      document.getElementById('main-screen').classList.add('hidden');
      document.getElementById('detail-screen').classList.remove('hidden', 'editing');
      document.getElementById('detail-title').textContent = `${userName}의 주차 등록`;
      window.scrollTo(0, 0);

      renderFloorTabs();
      renderDetailMap();
      renderFrequent();
      updateSelectionInfo();
    }

    function goToMain() {
      currentUser    = null;
      selectedSlotId = null;
      editMode = false; draftLayout = null;
      document.getElementById('detail-screen').classList.add('hidden');
      document.getElementById('detail-screen').classList.remove('editing');
      document.getElementById('main-screen').classList.remove('hidden');
    }

    async function handleBack() {
      if (editMode && draftDirty) {
        const ok = await confirmDialog('편집 취소', '저장하지 않은 배치 수정이 사라집니다. 나갈까요?', '나가기');
        if (!ok) return;
      }
      goToMain();
    }

    function renderFloorTabs() {
      const container = document.getElementById('floor-tabs');
      container.innerHTML = '';
      FLOORS.forEach(floor => {
        const btn = document.createElement('button');
        btn.className = 'floor-tab' + (floor === selectedFloor ? ' active' : '') + (layoutsData[floor] ? ' custom' : '');
        btn.textContent = floor;
        btn.addEventListener('click', () => {
          if (editMode) { showToast('편집 중에는 층을 바꿀 수 없어요. 저장하거나 취소해 주세요'); return; }
          selectedFloor  = floor;
          selectedSlotId = null;
          mapView.scale = null; mapView.posX = 0; mapView.posY = 0;
          renderFloorTabs();
          renderDetailMap();
          renderFrequent();
          updateSelectionInfo();
        });
        container.appendChild(btn);
      });
    }

    // ============================================
    // 13. 배치 편집
    // ============================================
    function cloneLayout(l) {
      return JSON.parse(JSON.stringify(l));
    }

    function setEditUI(on) {
      editMode = on;
      document.getElementById('detail-screen').classList.toggle('editing', on);
      if (on) {
        document.getElementById('edit-msg').innerHTML =
          `<strong>${selectedFloor} 배치 편집 중</strong><br>칸을 탭해 종류·이름을 바꾸고, 빈 곳(＋)을 탭해 칸을 추가하세요. 이 층에만 적용돼요.`;
      }
    }

    function startEdit() {
      if (!db) { showToast('⚠️ Firebase가 연결되지 않았습니다'); return; }
      draftFloor = selectedFloor;
      draftLayout = cloneLayout(getLayout(selectedFloor));
      draftDirty = false;
      selectedSlotId = null;
      setEditUI(true);
      renderDetailMap();
      updateSelectionInfo();
    }

    async function cancelEdit() {
      if (draftDirty) {
        const ok = await confirmDialog('편집 취소', '저장하지 않은 수정이 사라집니다. 취소할까요?', '취소하기');
        if (!ok) return;
      }
      draftLayout = null;
      setEditUI(false);
      refreshDetail();
    }

    async function saveEdit() {
      if (!db || !draftLayout) return;
      const cells = {};
      Object.values(draftLayout.cells).forEach(c => { cells[c.id] = { x: c.x, y: c.y, type: c.type, zone: c.zone, no: c.no }; });
      try {
        await set(ref(db, `layouts/${draftFloor}`), {
          cols: draftLayout.cols, rows: draftLayout.rows,
          cells, areas: draftLayout.areas,
          updatedAt: new Date().toISOString()
        });
        layoutsData[draftFloor] = { cols: draftLayout.cols, rows: draftLayout.rows, cells, areas: draftLayout.areas };
        draftLayout = null;
        setEditUI(false);
        renderFloorTabs();
        refreshDetail();
        showToast('✅ 배치가 저장되었습니다');
      } catch (err) {
        console.error('배치 저장 실패:', err);
        showToast('❌ 저장에 실패했습니다. 다시 시도해 주세요');
      }
    }

    async function resetEdit() {
      const ok = await confirmDialog('기본 배치로', `${draftFloor}의 수정 내용을 지우고 처음 배치로 되돌립니다.\n(저장을 눌러야 적용돼요)`, '되돌리기');
      if (!ok) return;
      draftLayout = buildDefaultLayout();
      draftDirty = true;
      renderDetailMap();
    }

    // --- 칸 편집 시트 ---
    function nextNoFor(zone) {
      let max = 0;
      Object.values(draftLayout.cells).forEach(c => { if (c.zone === zone && c.no > max) max = c.no; });
      return max + 1;
    }

    function setSheetType(type) {
      sheetCtx.type = type;
      document.querySelectorAll('#cell-type-group button').forEach(b => b.classList.toggle('active', b.dataset.type === type));
    }

    function openCellSheet(cell, x, y) {
      const zoneInput = document.getElementById('cell-zone');
      const noInput = document.getElementById('cell-no');
      const dl = document.getElementById('zone-list');
      dl.innerHTML = '';
      [...new Set(Object.values(draftLayout.cells).map(c => c.zone))].forEach(z => {
        const o = document.createElement('option'); o.value = z; dl.appendChild(o);
      });

      if (cell) {
        sheetCtx = { mode: 'edit', id: cell.id, type: cell.type };
        document.getElementById('cell-sheet-title').textContent = `${cell.zone} ${cell.no}번 칸 수정`;
        zoneInput.value = cell.zone;
        noInput.value = cell.no;
      } else {
        // 이웃한 칸의 구역을 기본값으로
        const nb = [[x - 1, y], [x + 1, y], [x, y - 1], [x, y + 1]]
          .map(([nx, ny]) => Object.values(draftLayout.cells).find(c => c.x === nx && c.y === ny))
          .find(Boolean);
        const zone = nb ? nb.zone : '';
        sheetCtx = { mode: 'add', x, y, type: 'normal' };
        document.getElementById('cell-sheet-title').textContent = '여기에 칸 추가';
        zoneInput.value = zone;
        noInput.value = zone ? nextNoFor(zone) : 1;
      }
      setSheetType(sheetCtx.type);
      document.getElementById('cell-delete').style.display = cell ? '' : 'none';
      document.getElementById('cell-sheet').classList.remove('hidden');
    }

    function closeCellSheet() {
      document.getElementById('cell-sheet').classList.add('hidden');
      sheetCtx = null;
    }

    function applyCellSheet() {
      const zone = document.getElementById('cell-zone').value.trim();
      const no = parseInt(document.getElementById('cell-no').value, 10);
      if (!zone) { showToast('구역 이름을 입력해 주세요'); return; }
      if (!(no >= 1)) { showToast('번호는 1 이상이어야 해요'); return; }
      const dup = Object.values(draftLayout.cells).some(c => c.zone === zone && c.no === no && c.id !== sheetCtx.id);
      if (dup) { showToast('같은 구역에 이미 있는 번호예요'); return; }

      if (sheetCtx.mode === 'add') {
        const id = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
        draftLayout.cells[id] = { id, x: sheetCtx.x, y: sheetCtx.y, type: sheetCtx.type, zone, no };
      } else {
        Object.assign(draftLayout.cells[sheetCtx.id], { type: sheetCtx.type, zone, no });
      }
      draftDirty = true;
      closeCellSheet();
      renderDetailMap();
    }

    function deleteCellFromSheet() {
      const id = sheetCtx.id;
      if (USERS.some(u => isAt(usersData[u], draftFloor, id))) {
        showToast('차가 등록된 칸은 삭제할 수 없어요');
        return;
      }
      delete draftLayout.cells[id];
      draftDirty = true;
      closeCellSheet();
      renderDetailMap();
    }

    // ============================================
    // 14. 확인 모달
    // ============================================
    function confirmDialog(title, message, okText = '확인') {
      return new Promise(resolve => {
        const modal = document.getElementById('confirm-modal');
        document.getElementById('confirm-title').textContent = title;
        const msg = document.getElementById('confirm-msg');
        msg.textContent = message;
        msg.style.whiteSpace = 'pre-line';
        const okBtn = document.getElementById('confirm-ok');
        const cancelBtn = document.getElementById('confirm-cancel');
        okBtn.textContent = okText;
        modal.classList.remove('hidden');

        const done = (val) => {
          modal.classList.add('hidden');
          okBtn.removeEventListener('click', onOk);
          cancelBtn.removeEventListener('click', onCancel);
          modal.removeEventListener('click', onBg);
          resolve(val);
        };
        const onOk = () => done(true);
        const onCancel = () => done(false);
        const onBg = (e) => { if (e.target === modal) done(false); };
        okBtn.addEventListener('click', onOk);
        cancelBtn.addEventListener('click', onCancel);
        modal.addEventListener('click', onBg);
      });
    }

    // ============================================
    // 15. 차량 아이콘 모달
    // ============================================
    function openIconModal() {
      document.getElementById('icon-modal').classList.remove('hidden');
      USERS.forEach(user => {
        const container = document.getElementById(`icons-${USER_KEY[user]}`);
        container.innerHTML = '';
        const currentIcon = usersData[user]?.carIcon || 'sedan';

        CAR_ICONS.forEach(icon => {
          const btn = document.createElement('button');
          btn.className = 'icon-option' + (icon.id === currentIcon ? ' selected' : '');
          btn.textContent = icon.emoji;
          btn.title = icon.name;
          btn.addEventListener('click', async () => {
            await saveCarIcon(user, icon.id);
            container.querySelectorAll('.icon-option').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            showToast(`${icon.emoji} ${user}의 아이콘이 변경되었습니다`);
          });
          container.appendChild(btn);
        });
      });
    }
    function closeIconModal() {
      document.getElementById('icon-modal').classList.add('hidden');
    }
    async function saveCarIcon(userName, iconId) {
      if (!db) return;
      try {
        await update(ref(db, `users/${userName}`), { carIcon: iconId });
      } catch (err) {
        console.error('아이콘 저장 실패:', err);
      }
    }

    // ============================================
    // 16. 유틸리티
    // ============================================
    function formatDateTime(isoString) {
      if (!isoString) return '';
      const d = new Date(isoString);
      const days = ['일','월','화','수','목','금','토'];
      const hours = d.getHours();
      const minutes = String(d.getMinutes()).padStart(2, '0');
      return `${d.getMonth() + 1}/${d.getDate()}(${days[d.getDay()]}) ${hours < 12 ? '오전' : '오후'} ${hours % 12 || 12}:${minutes}`;
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // 화면 폭이 바뀌면(폰 회전, 창 크기 변경) 지도를 다시 맞춤. 주소창 때문에 높이만 바뀌는 경우는 무시
    let lastWidth = window.innerWidth, resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (window.innerWidth === lastWidth) return;
        lastWidth = window.innerWidth;
        if (currentUser) {
          mapView.scale = null; mapView.posX = 0; mapView.posY = 0;
          renderDetailMap();
        }
      }, 200);
    });

    window.addEventListener('offline', () => showToast('⚠️ 인터넷 연결이 필요합니다'));
    window.addEventListener('online',  () => showToast('✅ 인터넷에 다시 연결되었습니다'));

    // ============================================
    // 17. 이벤트 바인딩
    // ============================================
    document.getElementById('card-heesoo').addEventListener('click', () => goToDetail('희수'));
    document.getElementById('card-chami').addEventListener('click',  () => goToDetail('차미'));
    document.getElementById('settings-btn').addEventListener('click', (e) => { e.stopPropagation(); openIconModal(); });
    document.getElementById('back-btn').addEventListener('click', handleBack);
    document.getElementById('register-btn').addEventListener('click', handleRegister);
    document.getElementById('modal-close-btn').addEventListener('click', closeIconModal);
    document.getElementById('icon-modal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeIconModal(); });

    document.getElementById('edit-btn').addEventListener('click', startEdit);
    document.getElementById('edit-save').addEventListener('click', saveEdit);
    document.getElementById('edit-cancel').addEventListener('click', cancelEdit);
    document.getElementById('edit-reset').addEventListener('click', resetEdit);

    document.querySelectorAll('#cell-type-group button').forEach(b => {
      b.addEventListener('click', () => setSheetType(b.dataset.type));
    });
    document.getElementById('cell-zone').addEventListener('input', (e) => {
      if (sheetCtx && sheetCtx.mode === 'add') {
        const z = e.target.value.trim();
        if (z) document.getElementById('cell-no').value = nextNoFor(z);
      }
    });
    document.getElementById('cell-ok').addEventListener('click', applyCellSheet);
    document.getElementById('cell-cancel').addEventListener('click', closeCellSheet);
    document.getElementById('cell-delete').addEventListener('click', deleteCellFromSheet);
    document.getElementById('cell-sheet').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeCellSheet(); });

    // ============================================
    // 18. 핀치 줌 / 팬 (모바일에서는 도면을 -90° 회전해서 세로 화면에 맞춤)
    // ============================================
    function initPinchZoom(container, wrapper) {
      pinchAbortCtrl = new AbortController();
      const signal = pinchAbortCtrl.signal;
      const isMobile = window.innerWidth < 768;
      if (!isMobile) return;   // PC에서는 줌 없이 그대로 표시

      const savedScale = mapView.scale;   // 이전 렌더에서 유지된 줌 (없으면 null)
      let scale = savedScale || 1;
      let minScale = 1;
      let posX = mapView.posX;
      let posY = mapView.posY;

      function applyTransform() {
        mapView.scale = scale; mapView.posX = posX; mapView.posY = posY;
        wrapper.style.transform = `translate(-50%, -50%) translate(${posX}px, ${posY}px) rotate(-90deg) scale(${scale})`;
      }

      // 회전 후 도면이 컨테이너에 꽉 차도록 최소 배율 계산
      function fit() {
        const cW = container.clientWidth || window.innerWidth;
        const cH = container.clientHeight || 300;
        const visualW = wrapper.offsetHeight;   // 회전하면 가로/세로가 바뀜
        const visualH = wrapper.offsetWidth;
        minScale = Math.min(cW / visualW, cH / visualH) * 0.97;
        if (!savedScale || savedScale < minScale) { scale = minScale; posX = 0; posY = 0; }
        applyTransform();
      }
      // 첫 렌더에서는 맞춤 배율이 정해질 때까지 숨겨 두어 깜빡임 방지
      if (savedScale) applyTransform(); else wrapper.style.visibility = 'hidden';
      requestAnimationFrame(() => { fit(); wrapper.style.visibility = ''; });

      let lastDist = 0;
      let isPinching = false;
      let dragStartX = 0, dragStartY = 0;
      let dragStartPosX = 0, dragStartPosY = 0;
      let lastTap = 0;

      container.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          e.preventDefault();
          isPinching = true;
          lastDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        } else if (e.touches.length === 1) {
          dragStartX = e.touches[0].clientX;
          dragStartY = e.touches[0].clientY;
          dragStartPosX = posX;
          dragStartPosY = posY;

          const now = Date.now();
          if (now - lastTap < 300) {
            e.preventDefault();
            if (scale > minScale * 1.2) { scale = minScale; posX = 0; posY = 0; }
            else { scale = minScale * 2.5; }
            applyTransform();
          }
          lastTap = now;
        }
      }, { passive: false, signal });

      container.addEventListener('touchmove', (e) => {
        if (isPinching && e.touches.length === 2) {
          e.preventDefault();
          const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
          scale = Math.max(minScale, Math.min(minScale * 5, scale * (dist / lastDist)));
          lastDist = dist;
          applyTransform();
        } else if (!isPinching && e.touches.length === 1 && scale > minScale * 1.01) {
          e.preventDefault();
          posX = dragStartPosX + (e.touches[0].clientX - dragStartX);
          posY = dragStartPosY + (e.touches[0].clientY - dragStartY);
          applyTransform();
        }
      }, { passive: false, signal });

      container.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) isPinching = false;
        if (scale <= minScale) { scale = minScale; posX = 0; posY = 0; applyTransform(); }
      }, { passive: false, signal });
    }

    // ============================================
    // 19. 앱 시작
    // ============================================
    function init() {
      if (!navigator.onLine) showToast('⚠️ 인터넷 연결이 필요합니다');
      setupListeners();
      renderMiniMap(document.getElementById('minimap-heesoo'), 'B2', '희수');
      renderMiniMap(document.getElementById('minimap-chami'),  'B2', '차미');
    }
    init();
  </script>
