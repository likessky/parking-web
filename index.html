<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- ============================================ -->
  <!-- 🅿️ 우리 주차 위치 — 평촌푸르지오센트럴파크      -->
  <!-- 희수·차미 주차 위치 공유 모바일 웹 앱           -->
  <!-- ============================================ -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🅿️ 차미희수 주차위치</title>
  <meta name="description" content="평촌푸르지오센트럴파크 지하주차장 주차 위치 실시간 공유">
  <!-- 모바일 홈 화면 추가 시 네이티브 앱처럼 보이게 -->
  <meta name="theme-color" content="#006241">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- 폰트: Pretendard (한글) + Noto Sans KR 폴백 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">

  <style>
    /* ========================================== */
    /* 1. 디자인 토큰 — Starbucks 스타일            */
    /* ========================================== */
    :root {
      --green-50:  #E6F2ED;
      --green-100: #C0DFD2;
      --green-300: #57A585;
      --green-500: #00704A;   /* Siren Green */
      --green-600: #006241;
      --green-700: #00543A;
      --green-800: #1E3932;   /* House Green */
      --mint:      #D4E9E2;
      --cream:     #F2F0EB;
      --subtle:    #F7F6F2;
      --gold:      #CBA258;
      --gold-dark: #B5873A;

      --bg-base:     #F2F0EB;
      --bg-elevated: #FFFFFF;
      --text:        #1E3932;
      --text-2:      #5A554C;
      --text-3:      #9B968A;
      --border:        #E4E1D8;
      --border-strong: #CBC7BB;

      --info-bg:    #E3EEF0;
      --info-fg:    #2E6B72;
      --warning-bg: #FBEFD6;
      --warning-fg: #A6791C;
      --error-fg:   #C0392B;

      --color-heesoo: #B5873A;
      --color-chami:  #00704A;

      --font: 'Pretendard Variable', 'Pretendard', 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --radius-full: 9999px;

      --shadow-sm: 0 1px 2px rgba(30,57,50,0.06);
      --shadow-md: 0 4px 14px rgba(30,57,50,0.10);
      --shadow-lg: 0 12px 28px rgba(30,57,50,0.16);

      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --t-fast: 120ms var(--ease-out);
      --t-base: 220ms var(--ease-out);
    }

    /* ========================================== */
    /* 2. 리셋 및 기본                              */
    /* ========================================== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100vh;
      font-family: var(--font);
      background: var(--bg-base);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    button { font-family: var(--font); }
    .hidden { display: none !important; }

    .screen {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.3s ease;
    }
    .screen.hidden { display: none; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* 공통 버튼 (pill) */
    .btn {
      font: 600 15px/1 var(--font);
      border-radius: var(--radius-full);
      padding: 0 22px;
      height: 44px;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast), transform var(--t-fast);
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--green-500); color: #fff; }
    .btn-primary:hover { background: var(--green-600); }
    .btn-secondary { background: transparent; color: var(--green-600); border-color: var(--green-600); }
    .btn-secondary:hover { background: var(--green-50); }
    .btn-ghost { background: transparent; color: var(--text); border-color: var(--border-strong); }
    .btn-ghost:hover { background: var(--subtle); }
    .btn-danger { background: transparent; color: var(--error-fg); border-color: var(--error-fg); }
    .btn-danger:hover { background: #FBE4E1; }
    .btn-sm { height: 36px; padding: 0 16px; font-size: 13px; }

    /* ========================================== */
    /* 3. 메인 화면 — 헤더 / 히어로                   */
    /* ========================================== */
    .app-header {
      display: flex; align-items: center; gap: 12px;
      padding: 14px clamp(20px, 5vw, 40px);
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      position: relative; z-index: 3;
    }
    .brand-badge {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--green-500); color: #fff;
      display: grid; place-items: center;
      font-weight: 800; font-size: 17px;
      box-shadow: 0 1px 3px rgba(30,57,50,.16);
    }
    .app-header h1 { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; color: var(--green-800); }
    .settings-btn {
      margin-left: auto;
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      font-size: 17px; cursor: pointer;
      display: grid; place-items: center;
      transition: background var(--t-fast);
    }
    .settings-btn:hover { background: var(--subtle); }

    .hero-banner {
      position: relative; overflow: hidden;
      background: var(--green-600); color: #fff;
      padding: 40px clamp(20px, 6vw, 56px);
    }
    .hero-banner::before, .hero-banner::after {
      content: ''; position: absolute; border: 1px solid rgba(255,255,255,.16); border-radius: 50%;
    }
    .hero-banner::before { width: 320px; height: 320px; right: -80px; top: -140px; }
    .hero-banner::after  { width: 200px; height: 200px; left: -100px; bottom: -120px; }
    .hero-inner { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; }
    .hero-banner .eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      margin-bottom: 12px; font-size: 11px; font-weight: 700; letter-spacing: .14em;
    }
    .hero-banner .eyebrow::before { content: ''; width: 28px; height: 2px; background: var(--gold); }
    .hero-banner h2 { font-size: clamp(24px, 4vw, 34px); font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px; }
    .hero-banner p { font-size: 15px; color: var(--mint); }

    /* ========================================== */
    /* 4. 메인 화면 — 사용자 카드                     */
    /* ========================================== */
    .users-container {
      display: grid; grid-template-columns: 1fr; gap: 20px;
      padding: 28px clamp(20px, 5vw, 40px) 40px;
      width: 100%; max-width: 1200px; margin: 0 auto;
    }
    @media (min-width: 900px) { .users-container { grid-template-columns: 1fr 1fr; } }

    .user-card {
      position: relative; overflow: hidden;
      min-height: 220px;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 20px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: box-shadow var(--t-base), transform var(--t-base);
    }
    .user-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .user-card.heesoo { --user-color: var(--color-heesoo); }
    .user-card.chami  { --user-color: var(--color-chami); }

    .minimap-wrap {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      opacity: 0.32; z-index: 1;
    }
    .user-info-wrap {
      position: relative; z-index: 5;
      display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
      text-align: right; pointer-events: none;
    }
    .user-name {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 5px 14px 5px 10px;
      border-radius: var(--radius-full);
      background: var(--user-color); color: #fff;
      font-size: 16px; font-weight: 800;
    }
    .car-icon-display { font-size: 22px; line-height: 1; }
    .parking-info {
      display: flex; align-items: center; justify-content: flex-end;
      min-height: 44px; padding: 8px 16px;
      background: rgba(255,255,255,0.92);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      font-size: 22px; font-weight: 800; letter-spacing: -0.4px;
      color: var(--user-color); word-break: keep-all;
    }
    .not-registered { font-size: 18px; color: var(--text-3); font-weight: 700; }
    .parking-time {
      font-size: 13px; font-weight: 600; color: var(--text-2);
      background: rgba(255,255,255,0.92);
      padding: 2px 10px; border-radius: var(--radius-full);
    }
    .parking-time:empty { display: none; }

    /* ========================================== */
    /* 5. 상세 화면 — 헤더 / 레이아웃                 */
    /* ========================================== */
    .detail-header {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
      padding: 14px clamp(16px, 4vw, 32px);
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      position: relative; z-index: 10;
    }
    .detail-header h2 { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; text-align: center; }
    .detail-header .back-btn { justify-self: start; }
    .detail-header .edit-btn { justify-self: end; }
    #detail-screen.editing .edit-btn { visibility: hidden; }

    .detail-content {
      display: flex; flex-direction: column; flex: 1;
      padding: 20px; gap: 20px;
      max-width: 1400px; margin: 0 auto; width: 100%;
    }
    .left-panel {
      display: flex; flex-direction: column; flex: 1; min-width: 0;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .right-panel { display: flex; flex-direction: column; gap: 16px; flex-shrink: 0; }
    @media (min-width: 1024px) {
      .detail-content { flex-direction: row; align-items: flex-start; }
      .left-panel { flex: 8; min-height: 60vh; }
      .right-panel { flex: 2.5; min-width: 300px; max-width: 360px; position: sticky; top: 20px; }
    }

    /* 자주 쓰는 칸 */
    .freq-section {
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-elevated);
    }
    .freq-title { font-size: 11px; font-weight: 800; letter-spacing: .12em; color: var(--green-600); margin-bottom: 8px; }
    .freq-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .freq-chip {
      display: inline-flex; align-items: center; gap: 6px;
      height: 36px; padding: 0 14px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-full);
      background: var(--bg-elevated); color: var(--text);
      font-size: 13px; font-weight: 700; cursor: pointer;
      transition: background var(--t-fast), border-color var(--t-fast);
    }
    .freq-chip:hover { background: var(--green-50); border-color: var(--green-500); }
    .freq-chip.active { background: var(--green-500); border-color: var(--green-500); color: #fff; }
    .freq-chip .badge {
      font-size: 10px; font-weight: 800; padding: 1px 7px; border-radius: var(--radius-full);
      background: var(--gold); color: #fff;
    }
    .freq-chip .cnt { color: var(--text-2); font-weight: 600; }
    .freq-chip.active .cnt { color: var(--mint); }
    .freq-empty { font-size: 13px; color: var(--text-3); }

    /* 층 탭 */
    .floor-tabs {
      display: flex; gap: 8px; padding: 12px 16px;
      background: var(--subtle);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .floor-tab {
      flex: 1 0 auto; min-width: 56px; height: 38px; padding: 0 14px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-full);
      background: var(--bg-elevated); color: var(--text-2);
      font-size: 14px; font-weight: 700; cursor: pointer;
      transition: background var(--t-fast), color var(--t-fast);
    }
    .floor-tab:hover { background: var(--green-50); }
    .floor-tab.active { background: var(--green-500); border-color: var(--green-500); color: #fff; }
    .floor-tab.custom::after { content: ' ✎'; font-size: 11px; opacity: .8; }

    /* 편집 바 */
    .edit-bar {
      display: none;
      flex-wrap: wrap; align-items: center; gap: 10px;
      padding: 12px 16px;
      background: var(--warning-bg); color: var(--warning-fg);
      border-bottom: 1px solid #EBD9AE;
    }
    #detail-screen.editing .edit-bar { display: flex; }
    .edit-bar .edit-msg { flex: 1 1 220px; font-size: 13px; font-weight: 700; line-height: 1.4; }
    .edit-bar .edit-msg strong { color: var(--green-800); }
    .edit-bar .edit-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    #detail-screen.editing .freq-section,
    #detail-screen.editing .right-panel { display: none; }

    /* ========================================== */
    /* 6. 주차장 배치도 (격자)                        */
    /* ========================================== */
    .map-container {
      flex: 1; padding: 12px; overflow: auto;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-elevated);
    }
    .map-zoom-wrapper {
      display: flex; align-items: center; justify-content: center;
      width: 100%;
    }
    .parking-grid {
      --sel-color: var(--green-500);
      position: relative;
      width: 100%; max-width: 1000px;
      padding: 24px;
      margin: 0 auto;
    }
    /* 칸·통로는 각자의 좌표에 절대 위치 (--g: 칸 사이 간격의 절반) */
    .parking-grid { --g: 2px; }
    .grid-cells {
      position: relative;
      width: 100%;
      aspect-ratio: var(--cols) / var(--rows);
    }
    /* 편집 중: 점 하나 = 1칸 자리. 빈 곳을 탭하면 새 칸 추가 */
    .grid-cells.edit-surface {
      background-image: radial-gradient(circle, var(--border-strong) 1.5px, transparent 2px);
      background-size: calc(100% / var(--cols)) calc(100% / var(--rows));
      cursor: copy;
    }

    .slot {
      position: absolute; min-width: 0; min-height: 0;
      background: #fff;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      cursor: pointer;
      transition: background var(--t-fast), border-color var(--t-fast), box-shadow var(--t-fast);
    }
    .slot-inner {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .slot:hover { background: var(--green-50); border-color: var(--green-300); }
    .slot-compact { background: var(--mint); border-color: #A9CBBE; }
    .slot-ev      { background: var(--info-bg); border-color: #B5D0D5; }
    .slot-compact:hover, .slot-ev:hover { filter: brightness(0.97); }

    .slot-text { position: relative; font-size: 14px; font-weight: 800; color: rgba(30,57,50,0.62); letter-spacing: -0.2px; }
    /* 내 이용 기록 히트맵 (--heat: 0~1) */
    .slot-heat {
      position: absolute; inset: 0; border-radius: inherit;
      background: var(--sel-color); opacity: calc(var(--heat) * 0.32);
      pointer-events: none;
    }
    .use-count {
      position: absolute; top: 2px; right: 4px;
      font-size: 10px; font-weight: 800; color: var(--green-800);
    }
    .zone-label {
      position: absolute; top: 2px; left: 4px;
      font-size: 10px; font-weight: 800; letter-spacing: -0.3px;
      color: var(--text-2); white-space: nowrap;
    }
    .type-badge {
      position: absolute; bottom: 2px; right: 4px;
      font-size: 10px; font-weight: 800; color: var(--green-700);
    }
    .slot-ev .type-badge { color: var(--info-fg); }

    .slot.selected { box-shadow: 0 0 0 3px var(--sel-color); background: #fff; z-index: 4; }
    .slot.parked { z-index: 3; }
    .slot.parked .slot-text { display: none; }
    .slot.parked-heesoo { background: var(--color-heesoo); border-color: var(--color-heesoo); }
    .slot.parked-chami  { background: var(--color-chami);  border-color: var(--color-chami); }
    .slot.parked .zone-label, .slot.parked .type-badge, .slot.parked .use-count { color: rgba(255,255,255,0.85); }
    .slot.parked .slot-heat { display: none; }

    .car-marker {
      display: flex; flex-direction: column; align-items: center; gap: 1px;
      font-size: 24px; line-height: 1;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.25));
    }
    .car-name { font-size: 10px; font-weight: 800; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }

    /* 편집 모드 */
    #detail-screen.editing .slot { box-shadow: 0 0 0 1px rgba(0,112,74,0.3); }
    /* 칸 편집 시트: 방향별 칸 추가 패드 */
    .addpad { display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 40px); gap: 6px; justify-content: center; margin: 4px 0 10px; }
    .addpad button {
      border: 1px solid var(--green-500); background: var(--green-50); color: var(--green-700);
      border-radius: var(--radius-md); font-size: 18px; font-weight: 800; cursor: pointer;
    }
    .addpad button:active { background: var(--green-100); }
    .addpad .a-up { grid-column: 2; grid-row: 1; }
    .addpad .a-left { grid-column: 1; grid-row: 2; }
    .addpad .a-center { grid-column: 2; grid-row: 2; display: grid; place-items: center; font-weight: 800; color: var(--green-800); border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--subtle); }
    .addpad .a-right { grid-column: 3; grid-row: 2; }
    .addpad .a-down { grid-column: 2; grid-row: 3; }
    .tool-row { display: flex; gap: 8px; }
    .tool-row .btn { flex: 1; padding: 0 8px; }

    /* 통로 / 출입구 */
    .area {
      position: absolute;
      display: flex; align-items: center; justify-content: center;
      border-radius: 10px; pointer-events: none; text-align: center;
    }
    #detail-screen.editing .area { pointer-events: auto; cursor: pointer; }
    .slot.moving, .area.moving { box-shadow: 0 0 0 3px var(--gold); z-index: 5; }
    .move-pad { display: none; flex-wrap: wrap; align-items: center; gap: 10px; flex: 1 1 100%; }
    #detail-screen.moving .move-pad { display: flex; }
    #detail-screen.moving .edit-normal { display: none; }
    .move-pad .edit-msg { flex: 1 1 140px; }
    .dpad { display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(2, 44px); gap: 6px; }
    .dpad button {
      border: 1px solid var(--warning-fg); background: #fff; color: var(--warning-fg);
      border-radius: var(--radius-md); font-size: 20px; font-weight: 800; cursor: pointer;
    }
    .dpad button:active { background: var(--warning-bg); }
    .dpad .d-up { grid-column: 2; grid-row: 1; }
    .dpad .d-left { grid-column: 1; grid-row: 2; }
    .dpad .d-down { grid-column: 2; grid-row: 2; }
    .dpad .d-right { grid-column: 3; grid-row: 2; }
    .move-opts { display: flex; flex-direction: column; gap: 6px; }
    /* 함께 밀기 미리보기 */
    .slot.push-preview, .area.push-preview { outline: 3px dashed #E07B39; outline-offset: 1px; z-index: 5; }
    .push-confirm {
      display: none; flex: 1 1 100%; flex-wrap: wrap; align-items: center; gap: 8px;
      padding: 8px 10px; background: #fff; border: 1.5px dashed #E07B39; border-radius: var(--radius-md);
    }
    #detail-screen.push-pending .push-confirm { display: flex; }
    .push-confirm .push-msg { flex: 1 1 160px; font-size: 13px; font-weight: 700; color: #B85C1E; line-height: 1.4; }
    .area-road { background: var(--subtle); border: 1px dashed var(--border-strong); }
    .area-entrance { background: var(--warning-bg); border: 1px dashed #E3CB93; }
    .area-label { font-size: 12px; font-weight: 800; color: var(--text-2); line-height: 1.25; }
    .area-entrance .area-label { font-size: 15px; color: var(--warning-fg); }

    /* 방위 */
    .grid-dir { position: absolute; font-size: 16px; font-weight: 800; color: var(--text-3); pointer-events: none; z-index: 5; }
    .grid-dir.dir-top    { top: 14px;    left: 50%;  transform: translate(-50%, -50%); }
    .grid-dir.dir-bottom { bottom: 14px; left: 50%;  transform: translate(-50%, 50%); }
    .grid-dir.dir-left   { left: 14px;   top: 50%;   transform: translate(-50%, -50%); }
    .grid-dir.dir-right  { right: 14px;  top: 50%;   transform: translate(50%, -50%); }

    /* 미니맵 */
    .parking-grid.mini { max-width: none; height: 100%; padding: 8px; margin: 0; --g: 1px; }
    .parking-grid.mini .grid-cells { height: 100%; aspect-ratio: auto; }
    .parking-grid.mini .slot { border-radius: 3px; cursor: default; }
    .parking-grid.mini .slot:hover { background: #fff; border-color: var(--border-strong); }
    .parking-grid.mini .slot-compact:hover { background: var(--mint); }
    .parking-grid.mini .slot-ev:hover { background: var(--info-bg); }
    .parking-grid.mini .car-marker { font-size: 16px; }
    .parking-grid.mini .car-name { display: none; }
    .parking-grid.mini .area-label { font-size: 8px; }
    .parking-grid.mini .area { border-radius: 4px; }
    .mini-pin {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      font-size: 34px; z-index: 100;
      text-shadow: 0 3px 6px rgba(0,0,0,0.5);
    }

    /* ========================================== */
    /* 7. 우측 조작 패널                             */
    /* ========================================== */
    .register-section {
      display: flex; flex-direction: column; gap: 12px;
      background: var(--bg-elevated);
      padding: 16px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    .selection-info {
      font-size: 14px; color: var(--text-2);
      background: var(--subtle);
      padding: 12px; border-radius: var(--radius-md);
      text-align: center; border: 1px solid var(--border);
    }
    .selection-info strong { display: block; margin-top: 4px; font-size: 17px; font-weight: 800; color: var(--green-800); letter-spacing: -0.3px; }
    .selection-info .swap-note { display: block; margin-top: 6px; font-size: 12px; font-weight: 700; color: var(--warning-fg); }

    .register-btn {
      width: 100%; height: 52px; border: none;
      border-radius: var(--radius-full);
      font-size: 17px; font-weight: 800; cursor: pointer;
      background: var(--border-strong); color: #fff;
      transition: background var(--t-fast), transform var(--t-fast);
    }
    .register-btn.active.heesoo { background: var(--color-heesoo); }
    .register-btn.active.chami  { background: var(--color-chami); }
    .register-btn.active:hover  { filter: brightness(0.94); }
    .register-btn.active:active { transform: scale(0.98); }
    .register-btn:disabled { cursor: not-allowed; }

    .legend-section {
      background: var(--bg-elevated);
      padding: 14px 16px; border-radius: var(--radius-lg);
      border: 1px solid var(--border); box-shadow: var(--shadow-sm);
    }
    .legend-section h3 { font-size: 11px; font-weight: 800; letter-spacing: .12em; color: var(--green-600); margin-bottom: 10px; }
    .legend-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; font-size: 13px; color: var(--text-2); font-weight: 600; }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .swatch { width: 18px; height: 18px; border-radius: 5px; border: 1px solid var(--border-strong); background: #fff; flex-shrink: 0; }
    .swatch.compact { background: var(--mint); border-color: #A9CBBE; }
    .swatch.ev { background: var(--info-bg); border-color: #B5D0D5; }
    .swatch.heesoo { background: var(--color-heesoo); border-color: var(--color-heesoo); }
    .swatch.chami { background: var(--color-chami); border-color: var(--color-chami); }
    .legend-hint { margin-top: 10px; font-size: 12px; color: var(--text-3); line-height: 1.45; }

    /* ========================================== */
    /* 8. 모달 / 시트                               */
    /* ========================================== */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(30,57,50,0.55); backdrop-filter: blur(3px);
      z-index: 100; display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    .modal-overlay.hidden { display: none; }
    .modal-content {
      background: var(--bg-elevated); border-radius: var(--radius-xl);
      padding: 28px 24px 24px;
      width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto;
      box-shadow: var(--shadow-lg);
    }
    .modal-content h3 { font-size: 19px; font-weight: 800; text-align: center; margin-bottom: 18px; letter-spacing: -0.3px; }
    .modal-content .modal-msg { font-size: 15px; line-height: 1.55; color: var(--text-2); text-align: center; margin-bottom: 20px; word-break: keep-all; }
    .modal-actions { display: flex; gap: 8px; }
    .modal-actions .btn { flex: 1; }

    .modal-user-section { margin-bottom: 22px; }
    .modal-user-section h4 { font-size: 15px; font-weight: 800; margin-bottom: 10px; }
    .modal-user-section h4.heesoo-title { color: var(--color-heesoo); }
    .modal-user-section h4.chami-title  { color: var(--color-chami); }
    .icon-options { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .icon-option {
      width: 54px; height: 54px; border: 2px solid var(--border); border-radius: 50%;
      background: var(--subtle); font-size: 27px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color var(--t-fast), background var(--t-fast);
    }
    .icon-option.selected { border-color: var(--green-500); background: var(--green-50); }

    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; font-weight: 800; color: var(--text-2); margin-bottom: 6px; letter-spacing: .04em; }
    .input {
      width: 100%; padding: 12px 16px;
      background: var(--bg-elevated);
      border: 1px solid var(--border); border-radius: var(--radius-md);
      font: 400 15px/1.4 var(--font); color: var(--text);
    }
    .input:focus { outline: none; border-color: var(--green-500); box-shadow: 0 0 0 3px rgba(0,112,74,0.14); }
    .pill-group { display: flex; gap: 8px; }
    .pill-group button {
      flex: 1; height: 40px; border-radius: var(--radius-full);
      border: 1px solid var(--border-strong); background: var(--bg-elevated);
      color: var(--text-2); font-size: 14px; font-weight: 700; cursor: pointer;
      transition: background var(--t-fast), color var(--t-fast);
    }
    .pill-group button.active { background: var(--green-500); border-color: var(--green-500); color: #fff; }
    .sheet-actions { display: flex; gap: 8px; margin-top: 18px; }
    .sheet-actions .btn { flex: 1; padding: 0 12px; }

    #toast {
      position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(120px);
      padding: 13px 22px; background: var(--green-800); color: #fff;
      font-size: 14px; font-weight: 700; border-radius: var(--radius-full);
      box-shadow: var(--shadow-lg); z-index: 200;
      transition: transform 0.4s var(--ease-out);
      white-space: nowrap; max-width: 92%; text-align: center; overflow: hidden; text-overflow: ellipsis;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* ========================================== */
    /* 9. 모바일 (767px 이하)                        */
    /* ========================================== */
    @media (max-width: 767px) {
      .app-header h1 { font-size: 16px; }
      .app-header { padding-top: calc(12px + env(safe-area-inset-top)); }
      .hero-banner { padding: 20px 20px; }
      .hero-banner h2 { font-size: 22px; margin-bottom: 4px; }
      .hero-banner .eyebrow { margin-bottom: 8px; }
      .hero-banner p { font-size: 13px; }
      .users-container { gap: 12px; padding: 16px 16px 24px; }
      .user-card { min-height: 170px; padding: 16px; }
      .parking-info { font-size: 19px; min-height: 40px; padding: 6px 12px; }

      /* 상세 화면: 한 화면에 고정, 지도가 남는 공간을 모두 사용 */
      #detail-screen { height: 100dvh; min-height: 0; overflow: hidden; }
      .detail-header {
        grid-template-columns: auto 1fr auto; padding: 8px 16px;
        padding-top: calc(8px + env(safe-area-inset-top));
      }
      .detail-header h2 { font-size: 16px; text-align: center; }
      .detail-content { padding: 0; gap: 0; min-height: 0; max-width: none; }
      .left-panel { border: none; border-radius: 0; box-shadow: none; min-height: 0; flex: 1; }
      .freq-section { display: flex; align-items: center; gap: 10px; padding: 6px 12px; }
      .freq-title { margin: 0; flex-shrink: 0; letter-spacing: .04em; }
      .freq-list { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; flex: 1; }
      .freq-list::-webkit-scrollbar { display: none; }
      .freq-chip { flex-shrink: 0; height: 34px; }
      .freq-empty { white-space: nowrap; }
      .floor-tabs { padding: 6px 12px; gap: 6px; }
      .floor-tab { height: 34px; }
      .edit-bar { padding: 8px 12px; }

      .map-container {
        position: relative; overflow: hidden; padding: 0;
        flex: 1; min-height: 0; touch-action: none;
        user-select: none; -webkit-user-select: none;
      }
      .map-zoom-wrapper {
        position: absolute; top: 50%; left: 50%;
        width: 900px;
        transform-origin: center center;
        will-change: transform;
      }
      .map-zoom-wrapper .parking-grid { max-width: none; width: 100%; }
      .map-zoom-wrapper .slot-inner { transform: rotate(90deg); }
      .map-zoom-wrapper .area-label { transform: rotate(90deg); white-space: nowrap; }
      .map-zoom-wrapper .grid-dir { font-size: 22px; }
      .map-zoom-wrapper .grid-dir.dir-top    { transform: translate(-50%, -50%) rotate(90deg); }
      .map-zoom-wrapper .grid-dir.dir-bottom { transform: translate(-50%, 50%) rotate(90deg); }
      .map-zoom-wrapper .grid-dir.dir-left   { transform: translate(-50%, -50%) rotate(90deg); }
      .map-zoom-wrapper .grid-dir.dir-right  { transform: translate(50%, -50%) rotate(90deg); }
      .map-zoom-wrapper .slot-text { font-size: 21px; }
      .map-zoom-wrapper .zone-label { font-size: 13px; top: 3px; left: 5px; }
      .map-zoom-wrapper .type-badge { font-size: 12px; }
      .map-zoom-wrapper .use-count { font-size: 12px; }
      .edit-btn-label { display: none; }
      .map-zoom-wrapper .car-marker { font-size: 28px; }
      .map-zoom-wrapper .car-name { font-size: 13px; }
      .map-zoom-wrapper .area-label { font-size: 14px; }
      .map-zoom-wrapper .area-entrance .area-label { font-size: 20px; }

      /* 하단 고정 등록 바 */
      .right-panel {
        position: relative; z-index: 20;
        margin: 0; gap: 0; width: 100%;
      }
      #detail-screen.editing .right-panel { display: none; }
      .legend-section { display: none; }
      .register-section {
        flex-direction: row; align-items: center; gap: 10px;
        border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        border-bottom: none; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
        box-shadow: 0 -4px 14px rgba(30,57,50,0.10);
      }
      .selection-info { flex: 1; min-width: 0; padding: 6px 10px; font-size: 12px; text-align: left; }
      .selection-info strong { font-size: 14px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .selection-info .swap-note { font-size: 11px; margin-top: 2px; }
      .register-btn { width: auto; min-width: 120px; flex-shrink: 0; height: 46px; font-size: 15px; padding: 0 16px; }

      #toast { bottom: 90px; }

      .modal-overlay.sheet { align-items: flex-end; padding: 0; }
      .modal-overlay.sheet .modal-content { max-width: none; border-radius: var(--radius-xl) var(--radius-xl) 0 0; }
    }
  </style>
</head>

<body>
  <!-- ========================================== -->
  <!-- 메인 화면: 희수/차미 주차 정보 카드            -->
  <!-- ========================================== -->
  <div id="main-screen" class="screen">
    <header class="app-header">
      <span class="brand-badge">P</span>
      <h1>차미희수 주차위치</h1>
      <button class="settings-btn" id="settings-btn" title="차량 아이콘 변경">⚙️</button>
    </header>

    <div class="hero-banner">
      <div class="hero-inner">
        <span class="eyebrow">평촌푸르지오센트럴파크</span>
        <h2>편리한 주차 위치 관리</h2>
        <p>오늘도 안전운전 하세요!</p>
      </div>
    </div>

    <div class="users-container">
      <div class="user-card heesoo" id="card-heesoo">
        <div class="minimap-wrap" id="minimap-heesoo"></div>
        <div class="user-info-wrap">
          <div class="user-name">
            <span class="car-icon-display" id="icon-heesoo">🚗</span>
            희수
          </div>
          <div id="info-heesoo" class="parking-info">
            <span class="not-registered">미등록</span>
          </div>
          <div id="time-heesoo" class="parking-time"></div>
        </div>
      </div>
      <div class="user-card chami" id="card-chami">
        <div class="minimap-wrap" id="minimap-chami"></div>
        <div class="user-info-wrap">
          <div class="user-name">
            <span class="car-icon-display" id="icon-chami">🚗</span>
            차미
          </div>
          <div id="info-chami" class="parking-info">
            <span class="not-registered">미등록</span>
          </div>
          <div id="time-chami" class="parking-time"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- 상세/등록 화면                                -->
  <!-- ========================================== -->
  <div id="detail-screen" class="screen hidden">
    <header class="detail-header">
      <button class="btn btn-ghost btn-sm back-btn" id="back-btn">← 뒤로</button>
      <h2 id="detail-title">주차 등록</h2>
      <button class="btn btn-secondary btn-sm edit-btn" id="edit-btn">✎ <span class="edit-btn-label">배치&nbsp;</span>편집</button>
    </header>

    <div class="detail-content">
      <div class="left-panel">
        <!-- 자주 쓰는 칸 -->
        <div class="freq-section" id="freq-section">
          <div class="freq-title">자주 쓰는 칸</div>
          <div class="freq-list" id="freq-list"></div>
        </div>
        <!-- 층 선택 탭 -->
        <div class="floor-tabs" id="floor-tabs"></div>
        <!-- 배치 편집 바 -->
        <div class="edit-bar" id="edit-bar">
          <div class="edit-msg edit-normal" id="edit-msg"></div>
          <div class="edit-actions edit-normal">
            <button class="btn btn-primary btn-sm" id="edit-save">저장</button>
            <button class="btn btn-ghost btn-sm" id="edit-cancel">취소</button>
            <button class="btn btn-ghost btn-sm" id="edit-undo">↶ 되돌리기</button>
            <button class="btn btn-ghost btn-sm" id="edit-restore" style="display:none">이전 저장본</button>
            <button class="btn btn-danger btn-sm" id="edit-reset">기본 배치로</button>
          </div>
          <div class="move-pad">
            <div class="edit-msg" id="move-msg"></div>
            <div class="dpad">
              <button type="button" class="d-up" data-dir="up" aria-label="위로">↑</button>
              <button type="button" class="d-left" data-dir="left" aria-label="왼쪽으로">←</button>
              <button type="button" class="d-down" data-dir="down" aria-label="아래로">↓</button>
              <button type="button" class="d-right" data-dir="right" aria-label="오른쪽으로">→</button>
            </div>
            <div class="move-opts">
              <button type="button" class="btn btn-ghost btn-sm" id="move-mode" style="display:none"></button>
              <button type="button" class="btn btn-ghost btn-sm" id="move-scope"></button>
              <button type="button" class="btn btn-ghost btn-sm" id="move-undo">↶ 되돌리기</button>
              <button type="button" class="btn btn-primary btn-sm" id="move-done">완료</button>
            </div>
            <div class="push-confirm">
              <span class="push-msg" id="push-msg"></span>
              <button type="button" class="btn btn-primary btn-sm" id="push-ok">함께 밀기</button>
              <button type="button" class="btn btn-ghost btn-sm" id="push-cancel">취소</button>
            </div>
          </div>
        </div>
        <!-- 주차장 배치도 -->
        <div class="map-container" id="detail-map"></div>
      </div>

      <div class="right-panel">
        <div class="register-section">
          <div class="selection-info" id="selection-info">칸을 선택해 주세요</div>
          <button class="register-btn" id="register-btn" disabled>등록하기</button>
        </div>
        <div class="legend-section">
          <h3>범례</h3>
          <div class="legend-list">
            <div class="legend-item"><span class="swatch"></span>일반</div>
            <div class="legend-item"><span class="swatch compact"></span>경차</div>
            <div class="legend-item"><span class="swatch ev"></span>전기차 ⚡</div>
            <div class="legend-item"><span class="swatch heesoo"></span>희수 차</div>
            <div class="legend-item"><span class="swatch chami"></span>차미 차</div>
            <div class="legend-item"><span class="swatch" style="background:linear-gradient(90deg,#fff,var(--green-100))"></span>자주 간 칸</div>
          </div>
          <p class="legend-hint">실제와 다르면 '배치 편집'에서 칸 종류를 바꾸고, 줄을 옮기거나 칸을 추가할 수 있어요. 한 줄을 옮겨도 다른 줄은 그대로예요. 층마다 따로 저장돼요.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- 차량 아이콘 선택 모달 -->
  <div id="icon-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <h3>🚗 차량 아이콘 선택</h3>
      <div class="modal-user-section">
        <h4 class="heesoo-title">희수</h4>
        <div class="icon-options" id="icons-heesoo"></div>
      </div>
      <div class="modal-user-section">
        <h4 class="chami-title">차미</h4>
        <div class="icon-options" id="icons-chami"></div>
      </div>
      <div class="modal-actions"><button class="btn btn-ghost" id="modal-close-btn">닫기</button></div>
    </div>
  </div>

  <!-- 확인 모달 -->
  <div id="confirm-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <h3 id="confirm-title">확인</h3>
      <p class="modal-msg" id="confirm-msg"></p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="confirm-cancel">취소</button>
        <button class="btn btn-primary" id="confirm-ok">확인</button>
      </div>
    </div>
  </div>

  <!-- 칸 편집 시트 -->
  <div id="cell-sheet" class="modal-overlay sheet hidden">
    <div class="modal-content">
      <h3 id="cell-sheet-title">칸 편집</h3>
      <div class="field">
        <label>주차칸 종류</label>
        <div class="pill-group" id="cell-type-group">
          <button type="button" data-type="normal">일반</button>
          <button type="button" data-type="compact">경차</button>
          <button type="button" data-type="ev">전기차</button>
        </div>
      </div>
      <div class="field">
        <label for="cell-zone">구역 이름</label>
        <input class="input" id="cell-zone" list="zone-list" maxlength="12" autocomplete="off">
        <datalist id="zone-list"></datalist>
      </div>
      <div class="field" id="cell-tools">
        <label>이 칸 옆에 칸 추가 (다른 줄은 움직이지 않아요)</label>
        <div class="addpad">
          <button type="button" class="a-up" data-dir="up" aria-label="위쪽에 추가">＋</button>
          <button type="button" class="a-left" data-dir="left" aria-label="왼쪽에 추가">＋</button>
          <span class="a-center" id="addpad-center"></span>
          <button type="button" class="a-right" data-dir="right" aria-label="오른쪽에 추가">＋</button>
          <button type="button" class="a-down" data-dir="down" aria-label="아래쪽에 추가">＋</button>
        </div>
        <div class="tool-row">
          <button type="button" class="btn btn-ghost btn-sm" id="cell-move">↔ 이 줄 이동</button>
          <button type="button" class="btn btn-ghost btn-sm" id="cell-split">✂ 여기서 줄 나누기</button>
        </div>
      </div>
      <div class="sheet-actions">
        <button class="btn btn-danger" id="cell-delete">삭제</button>
        <button class="btn btn-ghost" id="cell-cancel">취소</button>
        <button class="btn btn-primary" id="cell-ok">완료</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <!-- ========================================== -->
  <!-- JavaScript — Firebase + 앱 로직              -->
  <!-- ========================================== -->
  <script type="module">

      const app = initializeApp(firebaseConfig);
      db = getDatabase(app);
    } catch (err) {
      console.error('Firebase 초기화 실패:', err);
      showToast('⚠️ Firebase 설정을 확인해 주세요!');
    }

    // ============================================
    // 2. 상수
    // ============================================
    const USERS = ['희수', '차미'];
    const USER_KEY = { '희수': 'heesoo', '차미': 'chami' };
    const FLOORS = ['B2', 'B3', 'B4', 'B5', 'B6'];
    const HISTORY_MAX = 60;       // 자주 쓰는 칸·이용 기록 계산용 이력 보관 개수
    const FREQ_MAX = 4;           // 자주 쓰는 칸 표시 개수
    const TYPE_LABEL = { normal: '일반', compact: '경차', ev: '전기차' };

    const CAR_ICONS = [
      { id: 'sedan',   emoji: '🚗',  name: '세단' },
      { id: 'suv',     emoji: '🚙',  name: 'SUV' },
      { id: 'compact', emoji: '🚘',  name: '소형차' },
      { id: 'truck',   emoji: '🛻',  name: '트럭' },
      { id: 'sport',   emoji: '🏎️', name: '스포츠카' },
    ];
    function getCarEmoji(iconId) {
      return CAR_ICONS.find(i => i.id === iconId)?.emoji || '🚗';
    }

    // ============================================
    // 3. 기본 배치 (주차줄 단위)
    //    줄 = 위치(x,y) + 방향(h 가로 / v 세로) + 칸 목록. 칸 하나는 1×1.
    //    줄끼리 행·열을 공유하지 않으므로 한 줄을 옮겨도 다른 줄은 움직이지 않음.
    //    칸 id = "구역명-번호" (기본 칸) / "c..." (새로 추가한 칸)
    // ============================================
    function buildDefaultLayout() {
      const strips = {};
      let n = 0;
      const add = (zone, type, dir, x, y, count) => {
        const id = `s_${n++}`;
        strips[id] = {
          id, zone, x, y, dir,
          slots: Array.from({ length: count }, (_, i) => ({ id: `${zone}-${i + 1}`, type, no: i + 1 }))
        };
      };

      add('남측',       'normal',  'v', 0, 0, 10);
      add('서남측',     'normal',  'h', 2, 2, 4);
      add('서북측',     'normal',  'h', 7, 2, 4);
      add('북측모서리', 'normal',  'h', 11, 2, 2);
      add('중앙경차1',  'compact', 'h', 6, 5, 1);
      add('중앙경차2',  'compact', 'h', 6, 6, 1);
      add('중앙경차3',  'compact', 'h', 7, 6, 1);
      add('중앙일반',   'normal',  'h', 7, 5, 3);
      add('중앙북측',   'normal',  'v', 10, 5, 3);
      add('북서측',     'normal',  'v', 13, 0, 2);
      add('전기차1',    'ev',      'v', 13, 2, 1);
      add('전기차2',    'ev',      'v', 13, 3, 1);
      add('북동측',     'normal',  'v', 13, 4, 6);
      add('동측',       'normal',  'h', 1, 10, 12);

      return finalizeLayout({
        strips,
        areas: [
          { x: 2, y: 1, w: 4, h: 1, kind: 'road',     label: '내려가는<br>길' },
          { x: 7, y: 1, w: 4, h: 1, kind: 'road',     label: '올라가는<br>길' },
          { x: 1, y: 5, w: 5, h: 2, kind: 'entrance', label: '103동<br>출입구' },
        ]
      });
    }

    // ============================================
    // 4. 앱 상태
    //    - localStorage 미사용! 모든 데이터는 Firebase에만 저장
    // ============================================
    let usersData = { '희수': null, '차미': null };
    let layoutsData = {};             // Firebase layouts/{floor}
    let currentUser = null;
    let selectedFloor = 'B2';
    let selectedSlotId = null;
    let pinchAbortCtrl = null;
    const mapView = { scale: null, posX: 0, posY: 0 };   // 모바일 줌 상태 (재렌더 후에도 유지)

    // 배치 편집 상태
    let editMode = false;
    let draftLayout = null;
    let draftFloor = null;
    let draftDirty = false;
    let sheetCtx = null;
    let moveCtx = null;               // 이동 모드: { kind:'strip', stripId, step } | { kind:'area', index, step }
    let editBounds = null;            // 편집 중 표시 범위 (한 번 넓어지면 유지)
    let backupsData = {};             // Firebase layoutBackups/{floor} — 직전 저장본

    // ============================================
    // 5. 레이아웃 / 기록 헬퍼
    // ============================================
    function toArray(v) {
      if (Array.isArray(v)) return v.filter(Boolean);
      return v && typeof v === 'object' ? Object.values(v) : [];
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // 예전 형식(칸마다 x,y)을 줄(스트립) 형식으로 변환: 같은 구역에서 가로/세로로 이어진 칸을 한 줄로 묶음
    function cellsToStrips(rawCells) {
      const byZone = new Map();
      Object.keys(rawCells).forEach(id => {
        const c = rawCells[id];
        if (!c || !Number.isFinite(c.x) || !Number.isFinite(c.y)) return;
        const zone = String(c.zone ?? '');
        if (!byZone.has(zone)) byZone.set(zone, []);
        byZone.get(zone).push({ id, x: c.x, y: c.y, type: c.type || 'normal', no: Number(c.no) || 0 });
      });

      const strips = {};
      let n = 0;
      byZone.forEach((list, zone) => {
        const byPos = new Map(list.map(c => [`${c.x},${c.y}`, c]));
        const used = new Set();
        [...list].sort((a, b) => (a.y - b.y) || (a.x - b.x)).forEach(c => {
          if (used.has(c.id)) return;
          const free = k => { const o = byPos.get(k); return o && !used.has(o.id) ? o : null; };
          const dir = free(`${c.x + 1},${c.y}`) ? 'h' : free(`${c.x},${c.y + 1}`) ? 'v' : 'h';
          const chain = [c];
          used.add(c.id);
          let cur = c;
          for (;;) {
            const nxt = free(dir === 'h' ? `${cur.x + 1},${cur.y}` : `${cur.x},${cur.y + 1}`);
            if (!nxt) break;
            used.add(nxt.id); chain.push(nxt); cur = nxt;
          }
          const id = `s_${n++}`;
          strips[id] = { id, zone, x: c.x, y: c.y, dir, slots: chain.map(({ id, type, no }) => ({ id, type, no })) };
        });
      });
      return strips;
    }

    // 줄 목록 -> 칸 목록(cells)을 계산해 붙임. 칸 하나 = 1×1, 위치는 줄의 (x,y)에서 순번만큼 이동
    function finalizeLayout(L) {
      L.cells = {};
      Object.values(L.strips).forEach(s => {
        s.slots.forEach((sl, i) => {
          L.cells[sl.id] = {
            id: sl.id, type: sl.type, zone: s.zone, no: sl.no,
            x: s.dir === 'h' ? s.x + i : s.x,
            y: s.dir === 'h' ? s.y : s.y + i,
            stripId: s.id, idx: i
          };
        });
      });
      return L;
    }

    // 칸·통로가 차지하는 범위
    function layoutBounds(L) {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      Object.values(L.cells).forEach(c => {
        minX = Math.min(minX, c.x); minY = Math.min(minY, c.y);
        maxX = Math.max(maxX, c.x + 1); maxY = Math.max(maxY, c.y + 1);
      });
      L.areas.forEach(a => {
        minX = Math.min(minX, a.x); minY = Math.min(minY, a.y);
        maxX = Math.max(maxX, a.x + a.w); maxY = Math.max(maxY, a.y + a.h);
      });
      return Number.isFinite(minX) ? { minX, minY, maxX, maxY } : { minX: 0, minY: 0, maxX: 1, maxY: 1 };
    }

    function normalizeLayout(raw) {
      const areas = toArray(raw?.areas).map(a => ({
        x: Number(a.x) || 0, y: Number(a.y) || 0, w: Number(a.w) || 1, h: Number(a.h) || 1,
        kind: a.kind || 'road', label: a.label || ''
      }));
      let strips = {};
      if (raw?.strips) {
        const entries = Array.isArray(raw.strips) ? raw.strips.map((s, i) => [`s_${i}`, s]) : Object.entries(raw.strips);
        entries.forEach(([id, s]) => {
          if (!s || !Number.isFinite(Number(s.x)) || !Number.isFinite(Number(s.y))) return;
          const slots = toArray(s.slots)
            .filter(sl => sl && sl.id != null)
            .map(sl => ({ id: String(sl.id), type: sl.type || 'normal', no: Number(sl.no) || 0 }));
          if (!slots.length) return;
          strips[id] = { id, zone: String(s.zone ?? ''), x: Number(s.x), y: Number(s.y), dir: s.dir === 'v' ? 'v' : 'h', slots };
        });
      } else if (raw?.cells) {
        strips = cellsToStrips(raw.cells);
      }
      return finalizeLayout({ strips, areas });
    }

    function getLayout(floor) {
      return layoutsData[floor] ? normalizeLayout(layoutsData[floor]) : buildDefaultLayout();
    }

    function activeLayout(floor) {
      return (editMode && draftLayout && floor === draftFloor) ? draftLayout : getLayout(floor);
    }

    function findCell(floor, slotId) {
      return slotId ? getLayout(floor).cells[slotId] : null;
    }

    // 예전 영어/한글 ID -> 현재 표시 이름
    function getZoneName(id) {
      const map = {
        'L1': '남측', 'ROAD_DOWN': '내려가는길', 'ROAD_UP': '올라가는길',
        'B08': '서남측', 'B09': '서북측', 'TR1': '북측모서리',
        'ENTRANCE': '출입구', 'CP1': '중앙경차1', 'C1': '중앙일반',
        'CP2': '중앙경차2', 'CP3': '중앙경차3', 'B14': '중앙북측',
        'R1': '북서측', 'EV1': '전기차1', 'EV2': '전기차2',
        'B12': '북동측', 'BTM': '동측',
        '서측': '남측', '북서측': '서남측', '북동측': '서북측', '우측모서리': '북측모서리',
        '중앙동측': '중앙북측', '동측상단': '북서측', '동측하단': '북동측', '남측': '동측'
      };
      return map[id] || id;
    }

    // 주차 기록 -> 칸 id (예전 기록은 zone+slot 으로 변환)
    function recSlotId(rec) {
      if (!rec) return null;
      if (rec.slotId) return rec.slotId;
      if (rec.zone != null && rec.slot != null) return `${getZoneName(rec.zone)}-${rec.slot}`;
      return null;
    }
    function isAt(rec, floor, slotId) {
      return !!rec && !!rec.floor && rec.floor === floor && recSlotId(rec) === slotId;
    }
    function otherUser(user) { return user === '희수' ? '차미' : '희수'; }

    // ---- 칸 코드 (예: D7) ----
    // 글자 = 서로 맞닿은 칸 묶음(통로로 떨어지면 다른 글자), 숫자 = 묶음 안의 순번.
    // 순서는 휴대폰 화면(도면을 -90° 회전) 기준 위→아래, 왼→오른 읽기 순서.
    function computeCodes(layout) {
      const cells = Object.values(layout.cells);
      const byPos = new Map(cells.map(c => [`${c.x},${c.y}`, c]));
      const reading = (a, b) => (b.x - a.x) || (a.y - b.y);
      const neighbors = c => [[1, 0], [-1, 0], [0, 1], [0, -1]]
        .map(([dx, dy]) => byPos.get(`${c.x + dx},${c.y + dy}`)).filter(Boolean);

      const seen = new Set(), groups = [];
      [...cells].sort(reading).forEach(start => {
        if (seen.has(start.id)) return;
        const comp = [], stack = [start];
        seen.add(start.id);
        while (stack.length) {
          const c = stack.pop();
          comp.push(c);
          neighbors(c).forEach(n => { if (!seen.has(n.id)) { seen.add(n.id); stack.push(n); } });
        }
        groups.push(comp);
      });

      const codes = {};
      groups.forEach((comp, gi) => {
        const letter = gi < 26 ? String.fromCharCode(65 + gi) : String.fromCharCode(65 + Math.floor(gi / 26) - 1) + String.fromCharCode(65 + gi % 26);
        let ordered = [...comp].sort(reading);
        const ends = comp.filter(c => neighbors(c).length <= 1);
        const isPath = comp.length > 1 && ends.length === 2 && comp.every(c => neighbors(c).length <= 2);
        if (isPath) {                                   // 한 줄로 이어진 묶음은 줄을 따라 순번
          ordered = [];
          let cur = ends.sort(reading)[0], prev = null;
          while (cur) {
            ordered.push(cur);
            const next = neighbors(cur).find(n => n !== prev && !ordered.includes(n));
            prev = cur; cur = next;
          }
        }
        ordered.forEach((c, i) => { codes[c.id] = `${letter}${i + 1}`; });
      });
      return codes;
    }

    function codeFor(floor, slotId) {
      return slotId ? computeCodes(activeLayout(floor))[slotId] || null : null;
    }

    function spotText(s) {
      return s.code ? `${s.floor} · ${s.code} · ${s.zone}` : `${s.floor} · ${s.zone} ${s.no}번`;
    }

    // 기록의 표시용 {floor, zone, no, code} (배치에 칸이 있으면 배치의 이름 우선)
    function spotOf(rec) {
      const id = recSlotId(rec);
      const cell = id ? findCell(rec.floor, id) : null;
      if (cell) return { floor: rec.floor, zone: cell.zone, no: cell.no, code: codeFor(rec.floor, cell.id) };
      if (rec.slotId) return { floor: rec.floor, zone: rec.zone, no: rec.no };
      return { floor: rec.floor, zone: getZoneName(rec.zone), no: rec.slot };
    }

    function cellSpot(floor, cell) {
      return { floor, zone: cell.zone, no: cell.no, code: codeFor(floor, cell.id) };
    }

    // ============================================
    // 6. 선택 제한
    // ============================================
    function canSelect(cell, user) {
      if (cell.type === 'ev') {
        showToast('⚡ 전기차 전용 칸입니다');
        return false;
      }
      if (cell.type === 'compact' && user === '희수') {
        showToast('🚙 경차 전용 칸입니다. 희수 차는 주차할 수 없어요');
        return false;
      }
      return true;
    }

    // ============================================
    // 7. Firebase 실시간 리스너
    // ============================================
    function setupListeners() {
      if (!db) return;

      USERS.forEach(name => {
        onValue(ref(db, `users/${name}`), (snapshot) => {
          usersData[name] = snapshot.val();
          updateMainCard(name);
          if (currentUser) refreshDetail();
        });
      });

      onValue(ref(db, 'layoutBackups'), (snapshot) => {
        backupsData = snapshot.val() || {};
        if (editMode) updateRestoreBtn();
      });

      onValue(ref(db, 'layouts'), (snapshot) => {
        layoutsData = snapshot.val() || {};
        USERS.forEach(updateMainCard);
        if (currentUser) {
          renderFloorTabs();
          refreshDetail();
        }
      });
    }

    function refreshDetail() {
      // 선택한 칸이 배치에서 사라졌으면 선택 해제
      if (selectedSlotId && !activeLayout(selectedFloor).cells[selectedSlotId]) selectedSlotId = null;
      renderDetailMap();
      renderFrequent();
      updateSelectionInfo();
    }

    // ============================================
    // 8. 메인 화면 카드
    // ============================================
    function updateMainCard(userName) {
      const data = usersData[userName];
      const key = USER_KEY[userName];
      const infoEl = document.getElementById(`info-${key}`);
      const timeEl = document.getElementById(`time-${key}`);
      const iconEl = document.getElementById(`icon-${key}`);
      const minimapEl = document.getElementById(`minimap-${key}`);

      iconEl.textContent = getCarEmoji(data?.carIcon);
      if (data && data.floor) {
        const s = spotOf(data);
        infoEl.innerHTML = `<strong>${esc(spotText(s))}</strong>`;
        timeEl.textContent = formatDateTime(data.registeredAt);
        renderMiniMap(minimapEl, data.floor, userName);
      } else {
        infoEl.innerHTML = '<span class="not-registered">미등록</span>';
        timeEl.textContent = '';
        renderMiniMap(minimapEl, 'B2', userName);
      }
    }

    // ============================================
    // 9. 주차장 격자 렌더링
    //    interactive: 칸 클릭 가능 / mini: 축소판
    // ============================================
    function createParkingGrid(floor, interactive, mini, targetUser) {
      const layout = activeLayout(floor);
      const grid = document.createElement('div');
      grid.className = 'parking-grid' + (mini ? ' mini' : '');
      if (interactive && currentUser) {
        grid.style.setProperty('--sel-color', currentUser === '희수' ? 'var(--color-heesoo)' : 'var(--color-chami)');
      }

      // 표시 범위: 내용에 맞춤. 편집 중에는 가장자리에 여유를 두고, 한 번 넓어진 범위는 유지(화면이 출렁이지 않게)
      let b = layoutBounds(layout);
      const isEditView = interactive && editMode && floor === draftFloor;
      if (isEditView) {
        editBounds = editBounds
          ? {
              minX: Math.min(editBounds.minX, b.minX - 1), minY: Math.min(editBounds.minY, b.minY - 1),
              maxX: Math.max(editBounds.maxX, b.maxX + 1), maxY: Math.max(editBounds.maxY, b.maxY + 1)
            }
          : { minX: b.minX - 1, minY: b.minY - 1, maxX: b.maxX + 1, maxY: b.maxY + 1 };
        b = editBounds;
      }
      const W = b.maxX - b.minX, H = b.maxY - b.minY;
      grid.style.setProperty('--cols', W);
      grid.style.setProperty('--rows', H);

      const cellsEl = document.createElement('div');
      cellsEl.className = 'grid-cells';

      // 칸·통로는 모두 자기 좌표에 절대 위치로 배치 (다른 줄과 행/열을 공유하지 않음)
      const place = (el, x, y, w, h) => {
        el.style.left   = `calc(${((x - b.minX) / W * 100).toFixed(4)}% + var(--g))`;
        el.style.top    = `calc(${((y - b.minY) / H * 100).toFixed(4)}% + var(--g))`;
        el.style.width  = `calc(${(w / W * 100).toFixed(4)}% - 2 * var(--g))`;
        el.style.height = `calc(${(h / H * 100).toFixed(4)}% - 2 * var(--g))`;
      };

      const codes = (!mini) ? computeCodes(layout) : {};
      const moveStripId = moveCtx && moveCtx.kind === 'strip' ? moveCtx.stripId : null;

      // 통로 / 출입구 영역
      layout.areas.forEach((a, ai) => {
        const el = document.createElement('div');
        el.className = `area area-${a.kind}`;
        place(el, a.x, a.y, a.w, a.h);
        el.innerHTML = `<span class="area-label">${a.label || ''}</span>`;
        if (moveCtx && moveCtx.kind === 'area' && moveCtx.index === ai) el.classList.add('moving');
        else if (pendingPush && pendingPush.areaIdx.has(ai)) el.classList.add('push-preview');
        if (isEditView) el.addEventListener('click', () => { if (!moveCtx) startMove({ kind: 'area', index: ai }); });
        cellsEl.appendChild(el);
      });

      // 내 이용 기록 (히트맵)
      let usage = null, usageMax = 1;
      if (interactive && !mini && currentUser && !editMode) {
        usage = usageCounts(currentUser);
        usage.forEach(v => { if (v > usageMax) usageMax = v; });
      }

      Object.values(layout.cells).forEach(cell => {
        const slotEl = document.createElement('div');
        slotEl.className = `slot slot-${cell.type}`;
        place(slotEl, cell.x, cell.y, 1, 1);
        slotEl.dataset.slot = cell.id;

        let inner = '';
        if (!mini) {
          const used = usage ? (usage.get(`${floor}|${cell.id}`) || 0) : 0;
          if (used) inner += `<span class="slot-heat" style="--heat:${(0.3 + 0.7 * used / usageMax).toFixed(2)}"></span>`;
          if (cell.idx === 0) inner += `<span class="zone-label">${esc(cell.zone)}</span>`;
          inner += `<span class="slot-text">${esc(codes[cell.id] ?? cell.no)}</span>`;
          if (cell.type === 'compact') inner += '<span class="type-badge">경차</span>';
          if (cell.type === 'ev') inner += '<span class="type-badge">⚡</span>';
          if (used > 1) inner += `<span class="use-count">${used}회</span>`;
        }
        if (moveStripId && cell.stripId === moveStripId) slotEl.classList.add('moving');
        else if (pendingPush && pendingPush.stripIds.has(cell.stripId)) slotEl.classList.add('push-preview');

        // 주차된 차량 마커
        let parkedBy = null;
        USERS.forEach(u => { if (isAt(usersData[u], floor, cell.id)) parkedBy = u; });
        if (parkedBy) {
          slotEl.classList.add('parked', `parked-${USER_KEY[parkedBy]}`);
          inner += `<span class="car-marker">${getCarEmoji(usersData[parkedBy].carIcon)}<span class="car-name">${parkedBy}</span></span>`;
        }

        // 미니맵 위치 핀
        if (mini && targetUser && isAt(usersData[targetUser], floor, cell.id)) {
          slotEl.style.background = 'rgba(255, 71, 87, 0.9)';
          inner += '<span class="mini-pin">📍</span>';
        }

        slotEl.innerHTML = `<div class="slot-inner">${inner}</div>`;

        if (interactive && !editMode && selectedSlotId === cell.id && selectedFloor === floor) {
          slotEl.classList.add('selected');
        }

        if (interactive) {
          slotEl.addEventListener('click', () => {
            if (moveCtx) return;
            if (editMode) openCellSheet(cell);
            else handleSlotClick(cell);
          });
        }
        cellsEl.appendChild(slotEl);
      });

      // 편집 중: 빈 곳(점)을 탭하면 그 칸 자리에 새 칸 추가 (점 격자에 맞춰 정렬)
      if (isEditView) {
        cellsEl.classList.add('edit-surface');
        cellsEl.addEventListener('click', (e) => {
          if (e.target !== cellsEl || moveCtx) return;
          const px = b.minX + e.offsetX / (cellsEl.clientWidth / W);
          const py = b.minY + e.offsetY / (cellsEl.clientHeight / H);
          const x = b.minX + Math.floor(px - b.minX), y = b.minY + Math.floor(py - b.minY);
          if (findBlocker(layout, [{ x, y, w: 1, h: 1 }])) return;   // 칸 사이 틈을 잘못 누른 경우 무시
          openCellSheet(null, x, y);
        });
      }

      grid.appendChild(cellsEl);

      // 방위 표시 (도면 가장자리). 모바일에서는 도면이 회전되므로 CSS에서 글자만 역회전
      if (!mini) {
        [['dir-top', '서'], ['dir-right', '북'], ['dir-bottom', '동'], ['dir-left', '남']].forEach(([cls, txt]) => {
          const d = document.createElement('div');
          d.className = `grid-dir ${cls}`;
          d.textContent = txt;
          grid.appendChild(d);
        });
      }
      return grid;
    }

    function renderMiniMap(container, floor, userName) {
      container.innerHTML = '';
      container.appendChild(createParkingGrid(floor, false, true, userName));
    }

    function renderDetailMap() {
      const container = document.getElementById('detail-map');
      container.innerHTML = '';
      if (pinchAbortCtrl) { pinchAbortCtrl.abort(); pinchAbortCtrl = null; }

      const wrapper = document.createElement('div');
      wrapper.className = 'map-zoom-wrapper';
      wrapper.id = 'map-zoom-wrapper';
      wrapper.appendChild(createParkingGrid(selectedFloor, true, false));
      container.appendChild(wrapper);

      initPinchZoom(container, wrapper);
    }

    // ============================================
    // 10. 칸 선택 / 등록
    // ============================================
    function handleSlotClick(cell) {
      if (!canSelect(cell, currentUser)) return;
      selectedSlotId = (selectedSlotId === cell.id) ? null : cell.id;
      renderDetailMap();
      renderFrequent();
      updateSelectionInfo();
    }

    function updateSelectionInfo() {
      const infoEl = document.getElementById('selection-info');
      const btnEl  = document.getElementById('register-btn');
      const cell = findCell(selectedFloor, selectedSlotId);

      if (cell) {
        const other = otherUser(currentUser);
        const swap = isAt(usersData[other], selectedFloor, cell.id);
        infoEl.innerHTML = `선택: <strong>${esc(spotText(cellSpot(selectedFloor, cell)))}</strong>` +
          (swap ? `<span class="swap-note">${other} 차가 있던 칸 — 등록하면 ${currentUser} 차로 바뀝니다</span>` : '');
        btnEl.disabled = false;
        btnEl.className = `register-btn active ${USER_KEY[currentUser]}`;
        btnEl.textContent = swap ? '바꿔서 등록' : '등록하기';
      } else {
        infoEl.textContent = '칸을 선택해 주세요';
        btnEl.disabled = true;
        btnEl.className = 'register-btn';
        btnEl.textContent = '등록하기';
      }
    }

    async function handleRegister() {
      if (!currentUser || editMode) return;
      const cell = findCell(selectedFloor, selectedSlotId);
      if (!cell) return;

      const other = otherUser(currentUser);
      const takeover = isAt(usersData[other], selectedFloor, cell.id);
      if (takeover) {
        const ok = await confirmDialog(
          '주차 차량 변경',
          `${spotText(cellSpot(selectedFloor, cell))} 칸에는 ${other} 차가 등록되어 있어요.\n${currentUser} 차로 바꿀까요? (${other}은 미등록 상태가 됩니다)`,
          '바꾸기'
        );
        if (!ok) return;
      }

      if (await saveParking(currentUser, selectedFloor, cell, takeover)) {
        showToast(takeover ? `✅ ${currentUser} 차로 바뀌었습니다` : `✅ ${currentUser}의 주차 위치가 등록되었습니다!`);
        goToMain();
      }
    }

    // 주차 위치 저장 (takeover: 같은 칸의 상대 차 기록을 지움)
    async function saveParking(user, floor, cell, takeover) {
      if (!db) { showToast('⚠️ Firebase가 연결되지 않았습니다'); return false; }
      try {
        const now = new Date().toISOString();
        const snapshot = await get(ref(db, `users/${user}`));
        const cur = snapshot.val() || {};

        const history = toArray(cur.history);
        history.unshift({ floor, slotId: cell.id, zone: cell.zone, no: cell.no, registeredAt: now });
        if (history.length > HISTORY_MAX) history.length = HISTORY_MAX;

        const updates = {};
        updates[`users/${user}`] = {
          floor, slotId: cell.id, zone: cell.zone, no: cell.no,
          registeredAt: now,
          carIcon: cur.carIcon || 'sedan',
          history
        };
        if (takeover) {
          const o = otherUser(user);
          ['floor', 'slotId', 'zone', 'slot', 'no', 'registeredAt'].forEach(k => { updates[`users/${o}/${k}`] = null; });
        }
        await update(ref(db), updates);
        return true;
      } catch (err) {
        console.error('등록 실패:', err);
        showToast('❌ 등록에 실패했습니다. 다시 시도해 주세요');
        return false;
      }
    }

    // ============================================
    // 11. 자주 쓰는 칸
    // ============================================
    function favoriteList(user) {
      const d = usersData[user];
      if (!d) return [];
      const hist = toArray(d.history);
      const map = new Map();
      hist.forEach((h, i) => {
        const id = recSlotId(h);
        if (!h.floor || !id) return;
        const k = `${h.floor}|${id}`;
        const e = map.get(k) || { floor: h.floor, slotId: id, count: 0, firstIdx: i };
        e.count++;
        map.set(k, e);
      });
      const latestKey = hist[0] && recSlotId(hist[0]) ? `${hist[0].floor}|${recSlotId(hist[0])}` : null;
      return [...map.entries()]
        .map(([k, e]) => ({ ...e, key: k, latest: k === latestKey, cell: findCell(e.floor, e.slotId) }))
        .filter(e => e.cell)                                   // 삭제된 칸 제외
        .sort((a, b) => b.count - a.count || a.firstIdx - b.firstIdx)
        .slice(0, FREQ_MAX);
    }
    // 칸별 주차 횟수 (키: "층|칸id") — 히트맵용
    function usageCounts(user) {
      const counts = new Map();
      toArray(usageHistory(user)).forEach(h => {
        const id = recSlotId(h);
        if (!h.floor || !id) return;
        const k = `${h.floor}|${id}`;
        counts.set(k, (counts.get(k) || 0) + 1);
      });
      return counts;
    }
    function usageHistory(user) { return usersData[user]?.history; }

    function renderFrequent() {
      const box = document.getElementById('freq-list');
      box.innerHTML = '';
      const list = currentUser ? favoriteList(currentUser) : [];
      if (list.length === 0) {
        box.innerHTML = '<span class="freq-empty">등록하면 자주 쓰는 칸이 여기에 쌓여요</span>';
        return;
      }
      list.forEach(e => {
        const btn = document.createElement('button');
        btn.className = 'freq-chip' + (e.floor === selectedFloor && e.slotId === selectedSlotId ? ' active' : '');
        btn.innerHTML = esc(spotText(cellSpot(e.floor, e.cell))) +
          (e.count > 1 ? ` <span class="cnt">${e.count}회</span>` : '') +
          (e.latest ? ' <span class="badge">최근</span>' : '');
        btn.addEventListener('click', () => {
          if (editMode) return;
          if (!canSelect(e.cell, currentUser)) return;
          selectedFloor = e.floor;
          selectedSlotId = e.slotId;
          renderFloorTabs();
          renderDetailMap();
          renderFrequent();
          updateSelectionInfo();
        });
        box.appendChild(btn);
      });
    }

    // ============================================
    // 12. 화면 전환
    // ============================================
    function goToDetail(userName) {

    function goToMain() {

      document.getElementById('detail-screen').classList.add('hidden');

    async function handleBack() {
      if (editMode && draftDirty) {
        const ok = await confirmDialog('편집 취소', '저장하지 않은 배치 수정이 사라집니다. 나갈까요?', '나가기');

    function renderFloorTabs() {

          selectedFloor  = floor;
