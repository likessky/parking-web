    // ============================================
    // 13. 배치 편집
    // ============================================
    function cloneLayout(l) {
      return finalizeLayout(JSON.parse(JSON.stringify({ strips: l.strips, areas: l.areas })));
    }

    function newId(prefix) {
      return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    }

    // 편집 중 되돌리기 (편집 세션 동안 유지)
    let undoStack = [];
    function pushUndo() {
      undoStack.push(cloneLayout(draftLayout));
      if (undoStack.length > 50) undoStack.shift();
    }
    function undoEdit() {
      if (!draftLayout) return;
      if (!undoStack.length) { showToast('되돌릴 작업이 없어요'); return; }
      clearPendingPush();
      draftLayout = undoStack.pop();
      draftDirty = true;
      validateMoveCtx();
      renderDetailMap();
    }

    function updateRestoreBtn() {
      const btn = document.getElementById('edit-restore');
      btn.style.display = (editMode && backupsData[draftFloor || selectedFloor]) ? '' : 'none';
    }

    function setEditUI(on) {
      editMode = on;
      editBounds = null;
      document.getElementById('detail-screen').classList.toggle('editing', on);
      if (on) {
        document.getElementById('edit-msg').innerHTML =
          `<strong>${selectedFloor} 배치 편집 중</strong><br>칸·통로를 탭해 수정/이동하고, 빈 곳을 탭해 새 칸을 추가하세요. 한 줄을 옮겨도 다른 줄은 움직이지 않아요.`;
      }
      updateRestoreBtn();
    }

    function startEdit() {
      if (!db) { showToast('⚠️ Firebase가 연결되지 않았습니다'); return; }
      draftFloor = selectedFloor;
      draftLayout = cloneLayout(getLayout(selectedFloor));
      draftDirty = false;
      undoStack = [];
      moveCtx = null;
      selectedSlotId = null;
      setEditUI(true);
      renderDetailMap();
      updateSelectionInfo();
    }

    function leaveEdit() {
      clearPendingPush();
      draftLayout = null;
      moveCtx = null;
      document.getElementById('detail-screen').classList.remove('moving');
      setEditUI(false);
    }

    async function cancelEdit() {
      if (draftDirty) {
        const ok = await confirmDialog('편집 취소', '저장하지 않은 수정이 사라집니다. 취소할까요?', '취소하기');
        if (!ok) return;
      }
      leaveEdit();
      refreshDetail();
    }

    // ---- 줄 이동 ----
    function isMobileView() { return window.innerWidth < 768; }

    // 화면 기준 방향 -> 좌표 변화 (모바일은 도면이 -90° 회전돼 있음)
    function dirDelta(dir) {
      if (isMobileView()) return { right: [0, 1], left: [0, -1], up: [1, 0], down: [-1, 0] }[dir];
      return { right: [1, 0], left: [-1, 0], up: [0, -1], down: [0, 1] }[dir];
    }

    function boxesOverlap(a, b) {
      const e = 1e-6;
      return a.x < b.x + b.w - e && b.x < a.x + a.w - e && a.y < b.y + b.h - e && b.y < a.y + a.h - e;
    }

    // boxes 가 다른 칸/통로와 겹치면 그 이름을, 아니면 null
    function findBlocker(L, boxes, ignoreStripId, ignoreArea) {
      for (const c of Object.values(L.cells)) {
        if (ignoreStripId && c.stripId === ignoreStripId) continue;
        const cb = { x: c.x, y: c.y, w: 1, h: 1 };
        if (boxes.some(b => boxesOverlap(b, cb))) return c.zone;
      }
      for (const a of L.areas) {
        if (a === ignoreArea) continue;
        if (boxes.some(b => boxesOverlap(b, a))) return (a.label || '통로').replace(/<br>/g, '');
      }
      return null;
    }

    function validateMoveCtx() {
      if (!moveCtx) return;
      const ok = moveCtx.kind === 'strip' ? !!draftLayout?.strips[moveCtx.stripId] : !!draftLayout?.areas[moveCtx.index];
      if (!ok) {
        clearPendingPush();
        moveCtx = null;
        document.getElementById('detail-screen').classList.remove('moving');
      } else {
        updateMoveUI();
      }
    }

    // 함께 밀기 미리보기: { dx, dy, stripIds:Set, areaIdx:Set, names:[] }
    let pendingPush = null;

    function clearPendingPush() {
      if (!pendingPush) return false;
      pendingPush = null;
      document.getElementById('detail-screen').classList.remove('push-pending');
      return true;
    }

    function updateMoveUI() {
      if (!moveCtx || !draftLayout) return;
      let name;
      if (moveCtx.kind === 'strip') {
        const s = draftLayout.strips[moveCtx.stripId];
        name = `${s.zone} 줄 (${s.slots.length}칸)`;
      } else {
        name = (draftLayout.areas[moveCtx.index].label || '통로').replace(/<br>/g, ' ');
      }
      const resizing = moveCtx.kind === 'area' && moveCtx.mode === 'resize';
      const modeBtn = document.getElementById('move-mode');
      modeBtn.style.display = moveCtx.kind === 'area' ? '' : 'none';
      modeBtn.textContent = resizing ? '↔ 이동으로' : '⤢ 크기 조절';
      document.getElementById('move-scope').textContent = `단위 ${moveCtx.step}칸`;
      document.getElementById('move-msg').innerHTML = resizing
        ? `<strong>${esc(name)} 크기 조절 중</strong><br>→/↓로 늘리고 ←/↑로 줄여요. (오른쪽·아래 끝이 움직여요)`
        : `<strong>${esc(name)} 이동 중</strong><br>화살표로 옮겨요. 막히면 함께 밀 줄을 먼저 보여 드려요.`;
      if (pendingPush) {
        const names = [...new Set(pendingPush.names)];
        document.getElementById('push-msg').innerHTML =
          `<strong>${esc(names.slice(0, 3).join(', '))}${names.length > 3 ? ' 외' : ''}</strong>도 같이 ${moveCtx.step}칸 밀려요 (주황 표시)`;
      }
    }

    function startMove(ctx) {
      closeCellSheet();
      clearPendingPush();
      moveCtx = { ...ctx, step: 1, mode: 'move' };
      document.getElementById('detail-screen').classList.add('moving');
      updateMoveUI();
      renderDetailMap();
    }

    function endMove() {
      clearPendingPush();
      moveCtx = null;
      document.getElementById('detail-screen').classList.remove('moving');
      renderDetailMap();
    }

    // 줄({strip}) 또는 영역({area})이 차지하는 칸 상자들 (dx, dy 만큼 옮긴 위치)
    function itemBoxes(L, item, dx = 0, dy = 0) {
      if (item.strip) {
        const s = L.strips[item.strip];
        return s.slots.map((_, i) => ({
          x: (s.dir === 'h' ? s.x + i : s.x) + dx,
          y: (s.dir === 'h' ? s.y : s.y + i) + dy,
          w: 1, h: 1
        }));
      }
      const a = L.areas[item.area];
      return [{ x: a.x + dx, y: a.y + dy, w: a.w, h: a.h }];
    }

    // 옮길 대상 + 가는 길을 막는 줄/영역(연쇄)을 모음. 막는 것만 통째로 같이 움직이고 나머지는 그대로
    function computePush(L, start, dx, dy) {
      const stripIds = new Set(), areaIdx = new Set(), names = [];
      if (start.strip) stripIds.add(start.strip); else areaIdx.add(start.area);
      const queue = [start];
      while (queue.length) {
        const boxes = itemBoxes(L, queue.shift(), dx, dy);
        Object.values(L.strips).forEach(s => {
          if (stripIds.has(s.id)) return;
          if (itemBoxes(L, { strip: s.id }).some(sb => boxes.some(b => boxesOverlap(b, sb)))) {
            stripIds.add(s.id); names.push(s.zone); queue.push({ strip: s.id });
          }
        });
        L.areas.forEach((a, i) => {
          if (areaIdx.has(i)) return;
          if (boxes.some(b => boxesOverlap(b, a))) {
            areaIdx.add(i); names.push((a.label || '통로').replace(/<br>/g, '')); queue.push({ area: i });
          }
        });
      }
      return { dx, dy, stripIds, areaIdx, names };
    }

    function applyPush(plan) {
      pushUndo();
      plan.stripIds.forEach(id => { const s = draftLayout.strips[id]; s.x += plan.dx; s.y += plan.dy; });
      plan.areaIdx.forEach(i => { const a = draftLayout.areas[i]; a.x += plan.dx; a.y += plan.dy; });
      finalizeLayout(draftLayout);
      draftDirty = true;
      clearPendingPush();
      updateMoveUI();
      renderDetailMap();
    }

    function confirmPush() { if (pendingPush) applyPush(pendingPush); }
    function cancelPush() { if (clearPendingPush()) { updateMoveUI(); renderDetailMap(); } }

    function moveBy(dir) {
      if (!moveCtx || !draftLayout) return;
      clearPendingPush();
      if (moveCtx.kind === 'area' && moveCtx.mode === 'resize') { resizeArea(dir); return; }
      const [ux, uy] = dirDelta(dir);
      const dx = ux * moveCtx.step, dy = uy * moveCtx.step;
      const L = draftLayout;
      const start = moveCtx.kind === 'strip' ? { strip: moveCtx.stripId } : { area: moveCtx.index };
      if (start.strip ? !L.strips[start.strip] : !L.areas[start.area]) return;

      const plan = computePush(L, start, dx, dy);
      if (plan.names.length) {
        // 막는 것이 있으면 바로 옮기지 않고 함께 밀 대상을 보여 준 뒤 확인을 받음
        pendingPush = plan;
        document.getElementById('detail-screen').classList.add('push-pending');
        updateMoveUI();
        renderDetailMap();
        return;
      }
      applyPush(plan);
    }

    // 영역 크기 조절: 화면 기준 오른쪽 끝(→ 늘림 / ← 줄임), 아래쪽 끝(↓ 늘림 / ↑ 줄임)
    function resizeArea(dir) {
      const L = draftLayout;
      const a = L.areas[moveCtx.index];
      if (!a) return;
      const grow = dir === 'right' || dir === 'down';
      const [ex, ey] = dirDelta(dir === 'right' || dir === 'left' ? 'right' : 'down');   // 움직이는 끝의 도면 방향
      const d = grow ? moveCtx.step : -moveCtx.step;
      const n = { x: a.x, y: a.y, w: a.w, h: a.h };
      if (ex > 0) n.w += d; else if (ex < 0) { n.x -= d; n.w += d; }
      if (ey > 0) n.h += d; else if (ey < 0) { n.y -= d; n.h += d; }
      if (n.w < 0.5 || n.h < 0.5) { showToast('더 줄일 수 없어요'); return; }
      if (grow) {
        const blocker = findBlocker(L, [n], null, a);
        if (blocker) { showToast(`'${blocker}'와 겹쳐서 늘릴 수 없어요`); return; }
      }
      pushUndo();
      Object.assign(a, n);
      finalizeLayout(L);
      draftDirty = true;
      renderDetailMap();
    }

    // ---- 저장 / 복구 ----
    function serializeLayout(L) {
      const strips = {};
      Object.values(L.strips).forEach(s => {
        strips[s.id] = {
          zone: s.zone, x: s.x, y: s.y, dir: s.dir,
          slots: s.slots.map(sl => ({ id: sl.id, type: sl.type, no: sl.no }))
        };
      });
      return {
        strips,
        areas: L.areas.map(a => ({ x: a.x, y: a.y, w: a.w, h: a.h, kind: a.kind, label: a.label || '' }))
      };
    }

    async function saveEdit() {
      if (!db || !draftLayout) return;
      const data = serializeLayout(draftLayout);
      try {
        const prev = layoutsData[draftFloor];
        if (prev) {
          // 직전 저장본 보관 (실패해도 저장은 계속)
          try { await set(ref(db, `layoutBackups/${draftFloor}`), prev); }
          catch (e) { console.warn('이전 저장본 보관 실패:', e); }
        }
        await set(ref(db, `layouts/${draftFloor}`), { ...data, updatedAt: new Date().toISOString() });
        layoutsData[draftFloor] = data;
        if (prev) backupsData[draftFloor] = prev;
        leaveEdit();
        renderFloorTabs();
        refreshDetail();
        showToast('✅ 배치가 저장되었습니다');
      } catch (err) {
        console.error('배치 저장 실패:', err);
        showToast('❌ 저장에 실패했습니다. 다시 시도해 주세요');
      }
    }

    async function resetEdit() {
      const ok = await confirmDialog('기본 배치로', `${draftFloor}의 수정 내용을 지우고 처음 배치로 되돌립니다.\n(저장을 눌러야 적용돼요)`, '되돌리기');
      if (!ok) return;
      pushUndo();
      draftLayout = buildDefaultLayout();
      draftDirty = true;
      validateMoveCtx();
      renderDetailMap();
    }

    async function restoreBackup() {
      const raw = backupsData[draftFloor];
      if (!raw) { showToast('불러올 이전 저장본이 없어요'); return; }
      const ok = await confirmDialog('이전 저장본으로', `${draftFloor}의 직전 저장 배치를 불러옵니다.\n(저장을 눌러야 적용돼요)`, '불러오기');
      if (!ok) return;
      pushUndo();
      draftLayout = normalizeLayout(raw);
      draftDirty = true;
      validateMoveCtx();
      renderDetailMap();
    }

    // --- 칸 편집 시트 ---
    // 내부용 번호 (화면에는 칸 코드가 표시됨) — 같은 구역 이름 안에서 겹치지 않게만 부여
    function nextNoFor(zone, exceptStripId) {
      let max = 0;
      Object.values(draftLayout.cells).forEach(c => {
        if (c.stripId !== exceptStripId && c.zone === zone && c.no > max) max = c.no;
      });
      return max + 1;
    }

    function setSheetType(type) {
      sheetCtx.type = type;
      document.querySelectorAll('#cell-type-group button').forEach(b => b.classList.toggle('active', b.dataset.type === type));
    }

    function openCellSheet(cell, x, y) {
      const zoneInput = document.getElementById('cell-zone');
      const dl = document.getElementById('zone-list');
      dl.innerHTML = '';
      [...new Set(Object.values(draftLayout.cells).map(c => c.zone))].forEach(z => {
        const o = document.createElement('option'); o.value = z; dl.appendChild(o);
      });

      if (cell) {
        sheetCtx = { mode: 'edit', id: cell.id, type: cell.type };
        const code = computeCodes(draftLayout)[cell.id];
        document.getElementById('cell-sheet-title').textContent = `${code ? code + ' · ' : ''}${cell.zone} 칸 수정`;
        zoneInput.value = cell.zone;
        document.getElementById('addpad-center').textContent = code || '이 칸';
      } else {
        // 가까운 칸의 구역을 기본값으로
        let near = null, best = 1.6;
        Object.values(draftLayout.cells).forEach(c => {
          const d = Math.hypot(c.x - x, c.y - y);
          if (d < best) { best = d; near = c; }
        });
        sheetCtx = { mode: 'add', x, y, type: near ? near.type : 'normal' };
        document.getElementById('cell-sheet-title').textContent = '여기에 새 칸 추가';
        zoneInput.value = near ? near.zone : '';
      }
      setSheetType(sheetCtx.type);
      document.getElementById('cell-delete').style.display = cell ? '' : 'none';
      document.getElementById('cell-tools').style.display = cell ? '' : 'none';
      document.getElementById('cell-sheet').classList.remove('hidden');
    }

    function closeCellSheet() {
      document.getElementById('cell-sheet').classList.add('hidden');
      sheetCtx = null;
    }

    // 시트의 종류/구역 입력을 draft에 반영 (edit 모드). 성공 여부를 반환
    function commitEditFields() {
      const zone = document.getElementById('cell-zone').value.trim();
      if (!zone) { showToast('구역 이름을 입력해 주세요'); return false; }
      const cell = draftLayout.cells[sheetCtx.id];
      if (!cell) return false;
      const strip = draftLayout.strips[cell.stripId];
      const slot = strip.slots[cell.idx];
      if (strip.zone === zone && slot.type === sheetCtx.type) return true;
      pushUndo();
      if (strip.zone !== zone) {
        let n = nextNoFor(zone, strip.id) - 1;
        strip.slots.forEach(sl => { sl.no = ++n; });
        strip.zone = zone;
      }
      slot.type = sheetCtx.type;
      finalizeLayout(draftLayout);
      draftDirty = true;
      return true;
    }

    function applyCellSheet() {
      if (!sheetCtx) return;
      if (sheetCtx.mode === 'add') {
        const zone = document.getElementById('cell-zone').value.trim();
        if (!zone) { showToast('구역 이름을 입력해 주세요'); return; }
        const blocker = findBlocker(draftLayout, [{ x: sheetCtx.x, y: sheetCtx.y, w: 1, h: 1 }]);
        if (blocker) { showToast(`그 자리에는 이미 '${blocker}'이(가) 있어요`); return; }
        pushUndo();
        const id = newId('st');
        draftLayout.strips[id] = {
          id, zone, x: sheetCtx.x, y: sheetCtx.y, dir: 'h',
          slots: [{ id: newId('c'), type: sheetCtx.type, no: nextNoFor(zone) }]
        };
        finalizeLayout(draftLayout);
        draftDirty = true;
      } else if (!commitEditFields()) {
        return;
      }
      closeCellSheet();
      renderDetailMap();
    }

    // 이 칸의 (화면 기준) 방향 옆에 칸 추가 — 줄 끝이면 줄이 길어지고, 아니면 새 줄. 다른 줄은 움직이지 않음
    function addCellBeside(dir) {
      if (!sheetCtx || sheetCtx.mode !== 'edit') return;
      if (!commitEditFields()) return;
      const L = draftLayout;
      const cell = L.cells[sheetCtx.id];
      const strip = L.strips[cell.stripId];
      const [dx, dy] = dirDelta(dir);
      const nx = cell.x + dx, ny = cell.y + dy;
      const blocker = findBlocker(L, [{ x: nx, y: ny, w: 1, h: 1 }]);
      if (blocker) { showToast(`그 자리에는 이미 '${blocker}'이(가) 있어요`); return; }

      const axis = dx !== 0 ? 'h' : 'v';
      const forward = dx + dy > 0;
      const slot = { id: newId('c'), type: cell.type, no: nextNoFor(strip.zone) };
      pushUndo();
      if (strip.slots.length === 1) {                       // 한 칸짜리 줄: 방향을 정하며 이어 붙임
        strip.dir = axis;
        if (forward) strip.slots.push(slot);
        else { strip.slots.unshift(slot); strip.x = nx; strip.y = ny; }
      } else if (axis === strip.dir && forward && cell.idx === strip.slots.length - 1) {
        strip.slots.push(slot);
      } else if (axis === strip.dir && !forward && cell.idx === 0) {
        strip.slots.unshift(slot); strip.x = nx; strip.y = ny;
      } else {                                              // 줄 옆에 붙는 새 줄
        const id = newId('st');
        L.strips[id] = { id, zone: strip.zone, x: nx, y: ny, dir: axis, slots: [slot] };
      }
      finalizeLayout(L);
      draftDirty = true;
      closeCellSheet();
      renderDetailMap();
    }

    // 이 칸부터 뒤쪽을 새 줄로 분리하고 바로 이동 모드로 — 줄 중간에 통로를 낼 때
    function splitStripHere() {
      if (!sheetCtx || sheetCtx.mode !== 'edit') return;
      if (!commitEditFields()) return;
      const L = draftLayout;
      const cell = L.cells[sheetCtx.id];
      const strip = L.strips[cell.stripId];
      if (cell.idx === 0) { showToast('줄의 첫 칸이에요. 나누려는 지점의 칸을 골라 주세요'); return; }
      pushUndo();
      const tail = strip.slots.splice(cell.idx);
      const ns = { id: newId('st'), zone: strip.zone, dir: strip.dir, x: cell.x, y: cell.y, slots: tail };
      L.strips[ns.id] = ns;
      finalizeLayout(L);
      draftDirty = true;
      startMove({ kind: 'strip', stripId: ns.id });
      showToast('여기서부터 새 줄로 나뉘었어요. 화살표로 옮겨 통로를 만드세요');
    }

    function moveStripFromSheet() {
      if (!sheetCtx || sheetCtx.mode !== 'edit') return;
      if (!commitEditFields()) return;
      const cell = draftLayout.cells[sheetCtx.id];
      startMove({ kind: 'strip', stripId: cell.stripId });
    }

    function deleteCellFromSheet() {
      const id = sheetCtx.id;
      if (USERS.some(u => isAt(usersData[u], draftFloor, id))) {
        showToast('차가 등록된 칸은 삭제할 수 없어요');
        return;
      }
      const L = draftLayout;
      const cell = L.cells[id];
      const strip = L.strips[cell.stripId];
      pushUndo();
      const before = strip.slots.slice(0, cell.idx);
      const after = strip.slots.slice(cell.idx + 1);
      const posOf = k => strip.dir === 'h' ? { x: strip.x + k, y: strip.y } : { x: strip.x, y: strip.y + k };
      if (before.length) {
        if (after.length) {                                  // 줄 중간 삭제: 둘로 나뉨
          const p = posOf(cell.idx + 1);
          const ns = { id: newId('st'), zone: strip.zone, dir: strip.dir, x: p.x, y: p.y, slots: after };
          L.strips[ns.id] = ns;
        }
        strip.slots = before;
      } else if (after.length) {
        const p = posOf(1);
        strip.slots = after; strip.x = p.x; strip.y = p.y;
      } else {
        delete L.strips[strip.id];
      }
      finalizeLayout(L);
      draftDirty = true;
      closeCellSheet();
      renderDetailMap();
    }

    // ============================================
    // 14. 확인 모달
    // ============================================
    function confirmDialog(title, message, okText = '확인') {
      return new Promise(resolve => {
        const modal = document.getElementById('confirm-modal');
        document.getElementById('confirm-title').textContent = title;
        const msg = document.getElementById('confirm-msg');
        msg.textContent = message;
        msg.style.whiteSpace = 'pre-line';
        const okBtn = document.getElementById('confirm-ok');
        const cancelBtn = document.getElementById('confirm-cancel');
        okBtn.textContent = okText;
        modal.classList.remove('hidden');

        const done = (val) => {
          modal.classList.add('hidden');
          okBtn.removeEventListener('click', onOk);
          cancelBtn.removeEventListener('click', onCancel);
          modal.removeEventListener('click', onBg);
          resolve(val);
        };
        const onOk = () => done(true);
        const onCancel = () => done(false);
        const onBg = (e) => { if (e.target === modal) done(false); };
        okBtn.addEventListener('click', onOk);
        cancelBtn.addEventListener('click', onCancel);
        modal.addEventListener('click', onBg);
      });
    }

    // ============================================
    // 15. 차량 아이콘 모달
    // ============================================
    function openIconModal() {
      document.getElementById('icon-modal').classList.remove('hidden');
      USERS.forEach(user => {
        const container = document.getElementById(`icons-${USER_KEY[user]}`);
        container.innerHTML = '';
        const currentIcon = usersData[user]?.carIcon || 'sedan';

        CAR_ICONS.forEach(icon => {
          const btn = document.createElement('button');
          btn.className = 'icon-option' + (icon.id === currentIcon ? ' selected' : '');
          btn.textContent = icon.emoji;
          btn.title = icon.name;
          btn.addEventListener('click', async () => {
            await saveCarIcon(user, icon.id);
            container.querySelectorAll('.icon-option').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            showToast(`${icon.emoji} ${user}의 아이콘이 변경되었습니다`);
          });
          container.appendChild(btn);
        });
      });
    }
    function closeIconModal() {
      document.getElementById('icon-modal').classList.add('hidden');
    }
    async function saveCarIcon(userName, iconId) {
      if (!db) return;
      try {
        await update(ref(db, `users/${userName}`), { carIcon: iconId });
      } catch (err) {
        console.error('아이콘 저장 실패:', err);
      }
    }

    // ============================================
    // 16. 유틸리티
    // ============================================
    function formatDateTime(isoString) {
      if (!isoString) return '';
      const d = new Date(isoString);
      const days = ['일','월','화','수','목','금','토'];
      const hours = d.getHours();
      const minutes = String(d.getMinutes()).padStart(2, '0');
      return `${d.getMonth() + 1}/${d.getDate()}(${days[d.getDay()]}) ${hours < 12 ? '오전' : '오후'} ${hours % 12 || 12}:${minutes}`;
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // 화면 폭이 바뀌면(폰 회전, 창 크기 변경) 지도를 다시 맞춤. 주소창 때문에 높이만 바뀌는 경우는 무시
    let lastWidth = window.innerWidth, resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (window.innerWidth === lastWidth) return;
        lastWidth = window.innerWidth;
        if (currentUser) {
          mapView.scale = null; mapView.posX = 0; mapView.posY = 0;
          renderDetailMap();
        }
      }, 200);
    });

    window.addEventListener('offline', () => showToast('⚠️ 인터넷 연결이 필요합니다'));
    window.addEventListener('online',  () => showToast('✅ 인터넷에 다시 연결되었습니다'));

    // ============================================
    // 17. 이벤트 바인딩
    // ============================================
    document.getElementById('card-heesoo').addEventListener('click', () => goToDetail('희수'));
    document.getElementById('card-chami').addEventListener('click',  () => goToDetail('차미'));
    document.getElementById('settings-btn').addEventListener('click', (e) => { e.stopPropagation(); openIconModal(); });
    document.getElementById('back-btn').addEventListener('click', handleBack);
    document.getElementById('register-btn').addEventListener('click', handleRegister);
    document.getElementById('modal-close-btn').addEventListener('click', closeIconModal);
    document.getElementById('icon-modal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeIconModal(); });

    document.getElementById('edit-btn').addEventListener('click', startEdit);
    document.getElementById('edit-save').addEventListener('click', saveEdit);
    document.getElementById('edit-cancel').addEventListener('click', cancelEdit);
    document.getElementById('edit-reset').addEventListener('click', resetEdit);

    document.querySelectorAll('#cell-type-group button').forEach(b => {
      b.addEventListener('click', () => setSheetType(b.dataset.type));
    });
    document.getElementById('cell-move').addEventListener('click', moveStripFromSheet);
    document.getElementById('cell-split').addEventListener('click', splitStripHere);
    document.querySelectorAll('.addpad button').forEach(b => {
      b.addEventListener('click', () => addCellBeside(b.dataset.dir));
    });
    document.getElementById('edit-undo').addEventListener('click', undoEdit);
    document.getElementById('edit-restore').addEventListener('click', restoreBackup);
    document.querySelectorAll('.dpad button').forEach(b => {
      b.addEventListener('click', () => moveBy(b.dataset.dir));
    });
    document.getElementById('move-scope').addEventListener('click', () => {
      if (!moveCtx) return;
      moveCtx.step = moveCtx.step === 1 ? 0.5 : 1;
      cancelPush();
      updateMoveUI();
    });
    document.getElementById('move-mode').addEventListener('click', () => {
      if (!moveCtx || moveCtx.kind !== 'area') return;
      moveCtx.mode = moveCtx.mode === 'resize' ? 'move' : 'resize';
      cancelPush();
      updateMoveUI();
    });
    document.getElementById('push-ok').addEventListener('click', confirmPush);
    document.getElementById('push-cancel').addEventListener('click', cancelPush);
    document.getElementById('move-done').addEventListener('click', endMove);
    document.getElementById('move-undo').addEventListener('click', undoEdit);
    document.getElementById('cell-ok').addEventListener('click', applyCellSheet);
    document.getElementById('cell-cancel').addEventListener('click', closeCellSheet);
    document.getElementById('cell-delete').addEventListener('click', deleteCellFromSheet);
    document.getElementById('cell-sheet').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeCellSheet(); });

    // ============================================
    // 18. 핀치 줌 / 팬 (모바일에서는 도면을 -90° 회전해서 세로 화면에 맞춤)
    // ============================================
    function initPinchZoom(container, wrapper) {
      pinchAbortCtrl = new AbortController();
      const signal = pinchAbortCtrl.signal;
      const isMobile = window.innerWidth < 768;
      if (!isMobile) return;   // PC에서는 줌 없이 그대로 표시

      const savedScale = mapView.scale;   // 이전 렌더에서 유지된 줌 (없으면 null)
      let scale = savedScale || 1;
      let minScale = 1;
      let posX = mapView.posX;
      let posY = mapView.posY;

      function applyTransform() {
        mapView.scale = scale; mapView.posX = posX; mapView.posY = posY;
        wrapper.style.transform = `translate(-50%, -50%) translate(${posX}px, ${posY}px) rotate(-90deg) scale(${scale})`;
      }

      // 회전 후 도면이 컨테이너에 꽉 차도록 최소 배율 계산
      function fit() {
        const cW = container.clientWidth || window.innerWidth;
        const cH = container.clientHeight || 300;
        const visualW = wrapper.offsetHeight;   // 회전하면 가로/세로가 바뀜
        const visualH = wrapper.offsetWidth;
        minScale = Math.min(cW / visualW, cH / visualH) * 0.97;
        if (!savedScale || savedScale < minScale) { scale = minScale; posX = 0; posY = 0; }
        applyTransform();
      }
      // 첫 렌더에서는 맞춤 배율이 정해질 때까지 숨겨 두어 깜빡임 방지
      if (savedScale) applyTransform(); else wrapper.style.visibility = 'hidden';
      requestAnimationFrame(() => { fit(); wrapper.style.visibility = ''; });

      let lastDist = 0;
      let isPinching = false;
      let dragStartX = 0, dragStartY = 0;
      let dragStartPosX = 0, dragStartPosY = 0;
      let lastTap = 0;

      container.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          e.preventDefault();
          isPinching = true;
          lastDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        } else if (e.touches.length === 1) {
          dragStartX = e.touches[0].clientX;
          dragStartY = e.touches[0].clientY;
          dragStartPosX = posX;
          dragStartPosY = posY;

          const now = Date.now();
          if (now - lastTap < 300) {
            e.preventDefault();
            if (scale > minScale * 1.2) { scale = minScale; posX = 0; posY = 0; }
            else { scale = minScale * 2.5; }
            applyTransform();
          }
          lastTap = now;
        }
      }, { passive: false, signal });

      container.addEventListener('touchmove', (e) => {
        if (isPinching && e.touches.length === 2) {
          e.preventDefault();
          const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
          scale = Math.max(minScale, Math.min(minScale * 5, scale * (dist / lastDist)));
          lastDist = dist;
          applyTransform();
        } else if (!isPinching && e.touches.length === 1 && scale > minScale * 1.01) {
          e.preventDefault();
          posX = dragStartPosX + (e.touches[0].clientX - dragStartX);
          posY = dragStartPosY + (e.touches[0].clientY - dragStartY);
          applyTransform();
        }
      }, { passive: false, signal });

      container.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) isPinching = false;
        if (scale <= minScale) { scale = minScale; posX = 0; posY = 0; applyTransform(); }
      }, { passive: false, signal });
    }

    // ============================================
    // 19. 앱 시작
    // ============================================
    function init() {
      if (!navigator.onLine) showToast('⚠️ 인터넷 연결이 필요합니다');
      setupListeners();
      renderMiniMap(document.getElementById('minimap-heesoo'), 'B2', '희수');
      renderMiniMap(document.getElementById('minimap-chami'),  'B2', '차미');
    }
    init();
  </script>
